[package]
name = "snakes-core"
version = "0.16.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "GPL-3.0-or-later"

[lib]
name = "snakes_core"
crate-type = ["staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

[profile.dev]
opt-level = 1
panic = "abort"

[features]
desktop-diag = []
parity = []

[[example]]
name = "parity"
required-features = ["parity"]
