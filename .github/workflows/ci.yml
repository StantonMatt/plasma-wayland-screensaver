name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-output-presentation:
    name: Wayland multi-output (${{ matrix.graphics-api }})
    runs-on: ubuntu-26.04
    needs: kubuntu-package
    # Four 30s measurements plus bounded release download and dependency installation.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        graphics-api: [opengl, vulkan]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download freshly built package
        uses: actions/download-artifact@v6
        with:
          name: plasma-visual-screensaver-${{ github.sha }}
          path: ${{ runner.temp }}/package

      - name: Install binary and private compositor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "$RUNNER_TEMP"/package/*.deb kwin-wayland mesa-vulkan-drivers \
            libvulkan1 libgl1-mesa-dri dbus python3 qt6-wayland

      - name: Extract latest release baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-package" "$RUNNER_TEMP/frame-timing"
          # Resolve once so a release published mid-job cannot change the baseline.
          if tag=$(timeout 20s gh api "repos/$GH_REPO/releases/latest" --jq .tag_name) &&
             timeout 60s gh release download "$tag" --repo "$GH_REPO" \
               --pattern 'plasma-visual-screensaver_*_amd64.deb' --dir "$RUNNER_TEMP/release-package"; then
            packages=("$RUNNER_TEMP"/release-package/*.deb)
            if [[ ${#packages[@]} == 1 ]] &&
               dpkg-deb -x "${packages[0]}" "$RUNNER_TEMP/release-prefix" &&
               [[ -x "$RUNNER_TEMP/release-prefix/usr/bin/plasma-visual-screensaver" ]]; then
              echo "binary=$RUNNER_TEMP/release-prefix/usr/bin/plasma-visual-screensaver" >> "$GITHUB_OUTPUT"
              printf 'Release baseline: %s (%s)\n' "$tag" "$(basename "${packages[0]}")" \
                | tee "$RUNNER_TEMP/frame-timing/baseline.txt"
            else
              echo "::warning::Release package missing, ambiguous, or invalid; using absolute cadence checks."
            fi
          else
            echo "::warning::Latest release unavailable or download failed; using absolute cadence checks."
          fi

      - name: Compare three-output submission cadence with release
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          GALLIUM_DRIVER: llvmpipe
          BASELINE_BINARY: ${{ steps.baseline.outputs.binary }}
          GRAPHICS_API: ${{ matrix.graphics-api }}
        run: |
          # Isolate Vulkan from any hardware ICDs; both paths use Mesa CPU rendering.
          VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          export VK_DRIVER_FILES
          test -n "$VK_DRIVER_FILES"
          ./scripts/ci-frame-cadence.sh /usr/bin/plasma-visual-screensaver \
            "$BASELINE_BINARY" "$GRAPHICS_API" "$RUNNER_TEMP/frame-timing"

      - name: Upload timings and compositor logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frame-timing-${{ matrix.graphics-api }}-${{ github.sha }}
          path: ${{ runner.temp }}/frame-timing
          if-no-files-found: warn
          retention-days: 7

  kubuntu-package:
    name: Kubuntu 26.04 package
    runs-on: ubuntu-26.04
    timeout-minutes: 50

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream build-essential cargo rustc cmake debhelper desktop-file-utils \
            devscripts dpkg-dev extra-cmake-modules libkf6config-dev \
            libkf6idletime-dev liblayershellqtinterface-dev lintian ninja-build qt6-base-dev qt6-base-private-dev \
            qt6-declarative-dev qt6-shadertools-dev qt6-tools-dev qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-org-kde-kirigami qml6-module-org-kde-kcmutils \
            qml6-module-org-kde-kirigamiaddons-delegates qml6-module-qtquick-shapes shellcheck

      - name: Build, test, validate, and package
        run: ./scripts/build-deb.sh "$RUNNER_TEMP/build" "$RUNNER_TEMP/dist"

      - name: Build and lint Launchpad source package
        env:
          PPA_BUILD_BINARY: 0
          PPA_SOURCE_REF: HEAD
        run: ./scripts/build-ppa-source.sh "$RUNNER_TEMP/ppa"

      - name: Build and lint offline Debian binary package
        env:
          CARGO_NET_OFFLINE: true
        run: |
          dpkg-buildpackage -b -us -uc
          lintian --display-info --pedantic --fail-on error ../plasma-visual-screensaver_*_amd64.changes

      - name: Check drain exports in stripped CMake and Debian packages
        run: |
          for package in "$RUNNER_TEMP"/dist/*.deb ../plasma-visual-screensaver_*_amd64.deb; do
            destination=$(mktemp -d "$RUNNER_TEMP/drain-exports.XXXXXX")
            dpkg-deb --extract "$package" "$destination"
            python3 scripts/check-egldrain-exports.py "$destination/usr/bin/plasma-visual-screensaver"
            rm -rf "$destination"
          done

      - name: Upload installable package
        uses: actions/upload-artifact@v6
        with:
          name: plasma-visual-screensaver-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dist/*.deb
            ${{ runner.temp }}/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Launchpad source package
        uses: actions/upload-artifact@v6
        with:
          name: plasma-visual-screensaver-ppa-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ppa/*.dsc
            ${{ runner.temp }}/ppa/*.tar.*
            ${{ runner.temp }}/ppa/*_source.buildinfo
            ${{ runner.temp }}/ppa/*_source.changes
            ${{ runner.temp }}/ppa/*.SHA256SUMS
          if-no-files-found: error
          retention-days: 14
