name: Publish release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to publish; empty builds without publishing"
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build release Debian package
    runs-on: ubuntu-26.04
    timeout-minutes: 75

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0

      - name: Verify tag matches the project version
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          project_version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' CMakeLists.txt | head -1)
          if [[ "${RELEASE_TAG}" != "v${project_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match CMake version ${project_version}" >&2
            exit 1
          fi

      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream build-essential cargo rustc cmake debhelper desktop-file-utils devscripts dpkg-dev \
            extra-cmake-modules fonts-dejavu-mono fonts-noto-cjk libkf6config-dev libkf6idletime-dev \
            liblayershellqtinterface-dev lintian ninja-build qt6-base-dev qt6-base-private-dev \
            qt6-declarative-dev qt6-shadertools-dev qt6-tools-dev qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-org-kde-kirigami qml6-module-org-kde-kcmutils \
            qml6-module-org-kde-kirigamiaddons-delegates qml6-module-qtquick-shapes shellcheck

      - name: Build, test, validate, and package
        run: ./scripts/build-deb.sh "$RUNNER_TEMP/build" "$RUNNER_TEMP/dist"

      - name: Build and lint offline Debian binary package
        env:
          CARGO_NET_OFFLINE: true
        run: |
          dpkg-buildpackage -b -us -uc
          lintian --display-info --pedantic --fail-on error ../plasma-visual-screensaver_*_amd64.changes

      - name: Upload release build
        uses: actions/upload-artifact@v6
        with:
          name: release-debian-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dist/*.deb
            ${{ runner.temp }}/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Debian release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: releases
      cancel-in-progress: false
    steps:
      - name: Download verified release build
        uses: actions/download-artifact@v6
        with:
          name: release-debian-${{ github.sha }}
          path: ${{ runner.temp }}/dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/dist"
          sha256sum --check ./*.sha256
          gh release create "$RELEASE_TAG" \
            ./*.deb ./*.sha256 \
            --generate-notes \
            --title "Plasma Visual Screensaver ${RELEASE_TAG#v}" \
            --verify-tag
