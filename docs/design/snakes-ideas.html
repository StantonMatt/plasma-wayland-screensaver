<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snakes Wacky Ideas</title>
<style>
:root{
  --bar:rgba(12,15,24,.86);--line:rgba(255,255,255,.10);--text:#dde3f0;--dim:#8a93a8;
  --on:#f4f6fb;--onbg:rgba(255,255,255,.15);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--text);font:13px/1.35 "Noto Sans",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#bar{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;
  padding:6px 10px;background:var(--bar);border:1px solid var(--line);border-radius:10px;z-index:5;white-space:nowrap;
  flex-wrap:wrap;justify-content:center;row-gap:6px;max-width:calc(100vw - 32px);backdrop-filter:blur(8px)}
.g{display:flex;align-items:center;gap:7px}
.lbl{color:var(--dim);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.seg{display:flex;background:rgba(255,255,255,.05);border-radius:7px;padding:2px;gap:1px;flex-wrap:wrap}
button{appearance:none;border:0;background:transparent;color:var(--text);font:inherit;padding:4px 9px;border-radius:5px;cursor:pointer}
button:hover{background:rgba(255,255,255,.07)}
button[aria-pressed=true]{background:var(--onbg);color:var(--on)}
.pal{padding:5px 6px}
.pal span{display:flex;gap:1px}.pal i{width:4px;height:12px;border-radius:1px;display:block}
select{background:rgba(255,255,255,.06);color:var(--text);border:0;border-radius:6px;padding:4px 6px;font:inherit}
select option{background:#14171f}
#cap{position:fixed;left:16px;bottom:14px;max-width:470px;z-index:4;pointer-events:none;
  background:rgba(8,10,18,.70);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
#cap h2{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--on)}
#cap ol{margin:0;padding-left:18px;color:var(--dim)} #cap li.on{color:var(--on)}
#cap p{margin:0;color:var(--dim)}
#cap .cost{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:#a9b4cc;font-size:12px}
#stats{position:fixed;right:16px;bottom:14px;z-index:4;pointer-events:none;font-variant-numeric:tabular-nums;
  background:rgba(8,10,18,.70);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--dim);font-size:12px}
#stats b{color:var(--on);font-weight:600}
#clockWrap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;text-align:center;display:none}
#scrim{position:absolute;left:50%;top:50%;width:200%;height:320%;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(0,0,0,.52),rgba(0,0,0,.30) 55%,rgba(0,0,0,0));z-index:-1}
#clock{color:#f6f8ff;font-weight:300;letter-spacing:2px;text-shadow:0 1px 1px rgba(0,0,0,.25)}
#date{color:#c7d0e8;margin-top:10px}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <div class="g"><span class="lbl">Scene</span>
    <div class="seg" id="scene">
      <button data-v="faces">Faces</button><button data-v="race">Race</button><button data-v="venom">Venom</button>
      <button data-v="frost">Frost</button><button data-v="prism">Prism</button><button data-v="flip">Flip</button>
      <button data-v="whirl">Whirlpool</button><button data-v="events">Events</button><button data-v="chaos">Chaos</button></div></div>
  <div class="g"><span class="lbl">Palette</span><div class="seg" id="palette"></div></div>
  <div class="g"><select id="bg" aria-label="Background">
      <option value="black">Pure black</option><option value="midnight">Midnight</option>
      <option value="ocean">Deep ocean</option><option value="plum">Dark plum</option></select></div>
  <div class="seg">
    <button id="clockBtn">Clock</button><button id="calmBtn" title="Reduced motion">Calm</button><button id="labelsBtn">Notes</button><button id="pauseBtn">Pause</button></div>
</div>
<div id="clockWrap"><div id="scrim"></div><div id="clock"></div><div id="date"></div></div>
<div id="cap"></div>
<div id="stats"></div>
<script>
'use strict';
// ================================================================ utilities (shared with docs/design/snakes-design.html)
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const norm=a=>{a=(a+PI)%TAU;if(a<0)a+=TAU;return a-PI;};
function mulberry(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mulberry(7);
const hash=(a)=>{const x=Math.sin(a*127.1)*43758.5453;return x-Math.floor(x);};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const scaleC=(c,k)=>[c[0]*k,c[1]*k,c[2]*k];
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a<0?0:a>1?1:a})`;
const lum=c=>(0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255;
const WHITE=[255,255,255],BLACK=[0,0,0],ICE=[200,238,255],GOLD=[255,214,72];
const easeOut=p=>1-(1-p)*(1-p)*(1-p);
const easeBack=p=>{const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};
function hue(h){h=((h%1)+1)%1;const k=n=>{const q=(n+h*6)%6;return 255*(1-Math.max(0,Math.min(q,4-q,1)));};return[k(5),k(3),k(1)];}

const PALETTES={
  ocean:['#d9fbff','#3dd6e8','#3a86ff','#7358d6','#2aa889','#9bf6ff'],
  spectrum:['#ff477e','#ffbe0b','#42e2b8','#3a86ff','#b967ff','#fb5607'],
  ember:['#fff1a8','#ffc857','#ff7b42','#ef3e36','#9c1c28','#ffd6a5'],
  forest:['#d8f3dc','#95d5b2','#52b788','#2d6a4f','#b7e4c7','#74c69d'],
  mono:['#ffffff','#d9e1e8','#aeb8c2','#7f8b96','#edf2f4','#bac4ce'],
  pastel:['#ffc8dd','#bde0fe','#caffbf','#ffd6a5','#e7c6ff','#a2d2ff']};
const PAL_NAMES={ocean:'Ocean',spectrum:'Spectrum',ember:'Ember',forest:'Forest',mono:'Mono',pastel:'Pastel'};
const BGS={black:['#000000','#000000'],midnight:['#071329','#13091e'],ocean:['#02111d','#062f3c'],plum:['#18091d','#310d2c']};
const ACCENT_BASE={surge:'#ffe14d',magnet:'#ff5fd2',phase:'#a98bff',venom:'#9dff3a',frost:'#bdf3ff',flip:'#ff9a3c',whirl:'#33e0c8'};
const KIND_NAME={surge:'Surge',magnet:'Magnet',phase:'Phase',venom:'Venom',frost:'Frost',flip:'Flip',whirl:'Whirlpool'};
const EMO_BASE={bang:'#ffe48a',ask:'#c8d6f0',anger:'#ff6048',zz:'#aac8ff',heart:'#ff6eaa'};

const state={scene:'faces',palette:'ocean',bg:'black',clock:false,calm:false,labels:true,paused:false};
let PAL=[],ACC={},EMO={},CREST=[255,216,74],TONGUE=[255,92,122],EYE=[255,196,84],EYE_HUNT=[255,150,50],MONO=false;
const glowCache=new Map();
function tone(c){if(MONO){const l=lum(c)*255;return mix(c,[l,l,l],0.88);}if(state.palette==='pastel')return mix(c,WHITE,0.3);return c;}
function setPalette(name){
  state.palette=name;MONO=name==='mono';
  PAL=PALETTES[name].map(hex);
  for(const k in ACCENT_BASE)ACC[k]=tone(hex(ACCENT_BASE[k]));
  for(const k in EMO_BASE)EMO[k]=tone(hex(EMO_BASE[k]));
  CREST=(name==='ember'||name==='mono')?[255,250,236]:[255,214,72];
  TONGUE=MONO?[214,220,228]:[255,92,122];
  EYE=MONO?[232,236,244]:[255,196,84];
  EYE_HUNT=MONO?[255,255,255]:name==='ember'?[255,240,170]:[255,150,50];
  glowCache.clear();
}
const lifted=c=>{const l=lum(c);return l<0.3?mix(c,WHITE,(0.3-l)*1.1):c;};
function glowSprite(c){
  const k=(c[0]|0)+','+(c[1]|0)+','+(c[2]|0);let g=glowCache.get(k);if(g)return g;
  g=document.createElement('canvas');g.width=g.height=64;const x=g.getContext('2d');
  const gr=x.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,rgba(c,1));gr.addColorStop(0.22,rgba(c,.6));gr.addColorStop(0.55,rgba(c,.16));gr.addColorStop(1,rgba(c,0));
  x.fillStyle=gr;x.fillRect(0,0,64,64);if(glowCache.size>400)glowCache.clear();glowCache.set(k,g);return g;
}
function glow(ctx,x,y,R,c,a){if(a<=0.004||R<=0)return;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(glowSprite(c),x-R,y-R,R*2,R*2);ctx.globalAlpha=1;}

// ================================================================ world
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let dpr=1,VT=0; // VT = decorative shader time; frozen by Calm (reduced motion)
const W={w:0,h:0,R0:8,baseR0:8,t:0,vt:0,sceneT:0,snakes:[],food:[],items:[],fx:[],corpses:[],parts:[],orphans:[],bubbles:[],
  vortices:[],meteors:[],zones:[],night:0,nightTarget:0,leader:null,grid:new Map(),cell:32,foodTarget:0,itemTimer:0,sd:{},scene:null};
const rect=(x0,y0,x1,y1)=>({x0,y0,x1,y1});
const arena=()=>rect(0,0,W.w,W.h);
const calmK=()=>state.calm?1/0.6:1; // discrete effects play 60% as long under Calm

function taper(u){
  if(u<0.07)return 0.84+u*16/7;
  if(u>0.6){const k=(u-0.6)/0.4;return 1-0.78*Math.pow(k,1.6);}
  return 1;
}
let SID=0;
class Snake{
  constructor(o){
    Object.assign(this,{id:SID++,ci:0,len:20,angle:0,brain:null,immune:false,tier:null,leaderForce:false,
      birthLen:14,bounds:null,noWalls:false,speedMul:1,maxLen:420,rMul:1},o);
    this.alive=true;this.desired=this.angle;this.trail=[];this.ts=0;this.pts=[];
    this.boost={state:0,t:0,el:0,shed:0,cost:2};this.bvis=0;this.boostWaveT=0;
    this.effect=null;this.frozen=0;this.killGlow=0;this.waves=[];this.contrail=[];
    this.flags={hunting:false,trapped:false};this.growth=0;this.trapT=0;
    this.blink=0;this.blinkAt=W.t+1+rnd()*6;this.tongue=0;this.tongueAt=W.t+0.5+rnd()*4;
    this.leaderPulseAt=W.t+1;this.respawn=0;this.blockedFrac=0;
    // new: moods, emotes, bulges, held Flip
    this.happy=0;this.blep=0;this.angry=0;this.scared=0;this.dizzy=0;this.sleepy=0;this.yawn=0;this.yawnAt=W.t+3+rnd()*5;
    this.strike=0;this.stump=0;this.thawed=0;this.emoteAt=-99;this.grudge=null;this.grudgeT=0;this.frostHunt=0;
    this.bulges=[];this.flipCharge=0;this.goal=null;this.seed=Math.floor(rnd()*1000);
    if(o.path)this.layPath(o.path);else this.layStraight(o.x,o.y,this.angle,o.wave??1);
  }
  get r(){return W.R0*(this.rMul||1)*(1+Math.min(0.25,Math.max(0,this.len-this.birthLen)*0.0025));}
  get sp(){return this.r*1.18;}
  layStraight(x,y,a,wave=0){const step=this.sp*0.5,K=Math.ceil((this.len+6)*this.sp/step),pts=[];
    const A=this.r*2.4*wave,lam=this.r*11,ph=this.id*1.7,px=-Math.sin(a),py=Math.cos(a);
    for(let k=K;k>=0;k--){const d=k*step,o=A*Math.sin(d/lam+ph)*Math.min(1,d/(this.r*8))-A*Math.sin(ph)*0;pts.push({x:x-Math.cos(a)*d+px*o,y:y-Math.sin(a)*d+py*o});}this.layPath(pts);}
  layPath(pts){this.trail=[];this.ts=0;let d=0;
    for(let i=0;i<pts.length;i++){if(i)d+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);this.trail.push({x:pts[i].x,y:pts[i].y,d});}
    const h=pts[pts.length-1];this.hx=h.x;this.hy=h.y;this.place();}
  place(){
    const tr=this.trail,n=this.len,sp=this.sp,pts=this.pts;pts.length=0;
    let ci=tr.length-1;const nw=tr[ci];pts.push({x:nw.x,y:nw.y});
    for(let j=1;j<n;j++){const target=nw.d-sp*j;
      while(ci>this.ts&&tr[ci].d>target)ci--;
      const a=tr[ci],b=tr[Math.min(ci+1,tr.length-1)];const t=clamp((target-a.d)/Math.max(1e-4,b.d-a.d),0,1);
      pts.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});}
    while(this.ts<tr.length-2&&tr[this.ts+1].d<nw.d-sp*(n+3))this.ts++;
    if(this.ts>600){tr.splice(0,this.ts);this.ts=0;}
  }
  speed(){let v=W.R0*11*this.speedMul/(1+Math.max(0,this.len-24)*0.004);
    if(this.boost.state===1)v*=1.6;if(this.effect&&this.effect.kind==='surge')v*=1.25;if(this.frozen>0)v*=0.5;
    if(W.night>0)v*=1-0.1*W.night;return v;}
  turnRate(){return Math.min(3.4,this.speed()/(3.15*this.r))*(this.frozen>0?0.6:1)+0.6;}
  tryBoost(){
    const b=this.boost;if(b.state!==0||this.frozen>0)return false;
    const free=this.effect&&this.effect.kind==='surge';
    if(!free&&this.len<12)return false;
    b.state=1;b.t=0.8;b.el=0;b.shed=0;b.cost=free?0:2+Math.floor(this.len/100);
    const h=this.pts[0];W.fx.push({type:'ring',x:h.x,y:h.y,r0:this.r,r1:this.r*3.2,t:0,dur:0.28,c:mix(colOf(this),WHITE,.5),lw:1.5});
    return true;
  }
  shed(){const t=this.pts[this.pts.length-1];
    addFood({x:t.x,y:t.y,kind:'pellet',ci:this.ci,value:0.5,life:8,vx:(rnd()-.5)*30,vy:(rnd()-.5)*30});
    this.len=Math.max(6,this.len-1);}
  eat(v){this.growth+=v;while(this.growth>=1&&this.len<this.maxLen){this.len++;this.growth-=1;}}
  step(dt){
    const ctl=this.brain?this.brain(this,dt):{angle:this.angle};
    if(ctl.flip&&this.flipCharge>0){doFlip(this);return;}
    if(ctl.boost)this.tryBoost();
    const b=this.boost;
    if(b.state===1){b.t-=dt;b.el+=dt;
      if(b.shed<b.cost&&b.el>=b.shed*(0.7/Math.max(1,b.cost))){this.shed();b.shed++;}
      this.boostWaveT-=dt;if(this.boostWaveT<=0){this.boostWaveT=0.11;this.waves.push({pos:0,spd:2.4,c:mix(colOf(this),WHITE,.55),str:0.55,w:3});}
      if(b.t<=0){b.state=2;b.t=(this.effect&&this.effect.kind==='surge')?0.6:1.2;}}
    else if(b.state===2){b.t-=dt;if(b.t<=0)b.state=0;}
    this.bvis+=((b.state===1?1:0)-this.bvis)*Math.min(1,dt*(b.state===1?9:2.6));
    this.desired=ctl.angle;
    const diff=norm(ctl.angle-this.angle),tr=this.turnRate()*dt;
    this.angle=norm(this.angle+clamp(diff,-tr,tr));
    const v=this.speed();
    this.hx+=Math.cos(this.angle)*v*dt;this.hy+=Math.sin(this.angle)*v*dt;
    if(!this.noWalls){const m=this.r*1.2,bd=this.bounds||arena();
      this.hx=clamp(this.hx,bd.x0+m,bd.x1-m);this.hy=clamp(this.hy,bd.y0+m,bd.y1-m);}
    const last=this.trail[this.trail.length-1];const dd=Math.hypot(this.hx-last.x,this.hy-last.y);
    if(dd>0.01)this.trail.push({x:this.hx,y:this.hy,d:last.d+dd});
    this.place();
    if(this.effect){this.effect.t-=dt;if(this.effect.t<=0){const h=this.pts[0];
      W.fx.push({type:'ring',x:h.x,y:h.y,r0:this.r*2,r1:this.r*0.5,t:0,dur:0.35,c:ACC[this.effect.kind],lw:1});
      if(this.effect.kind==='flip')this.flipCharge=0;this.effect=null;}}
    if(this.frozen>0){this.frozen-=dt;if(this.frozen<=0){this.thawed=0.5;const h=this.pts[0];
      W.fx.push({type:'shatter',x:h.x,y:h.y,t:0,dur:0.45*calmK()/calmK(),c:ICE,r:this.r,seed:rnd()*100});}}
    const k=dt/calmK();
    this.killGlow=Math.max(0,this.killGlow-dt*0.9);
    for(const key of['happy','blep','angry','scared','dizzy','yawn','strike','stump','thawed','grudgeT','frostHunt'])if(this[key]>0)this[key]=Math.max(0,this[key]-dt);
    if(W.t>this.blinkAt){this.blink=0.15;this.blinkAt=W.t+4+rnd()*7;}this.blink=Math.max(0,this.blink-dt);
    if(W.t>this.tongueAt){this.tongue=0.34;this.tongueAt=W.t+(this.flags.hunting?1.4:3)+rnd()*5;}this.tongue=Math.max(0,this.tongue-dt);
    if((this===W.leader||this.leaderForce)&&W.t>this.leaderPulseAt){this.waves.push({pos:0,spd:0.75,c:CREST,str:0.5,w:7});this.leaderPulseAt=W.t+4;}
    for(const w of this.waves)w.pos+=w.spd*dt*calmK();this.waves=this.waves.filter(w=>w.pos<1.15);
    for(const g of this.bulges)g.pos+=g.spd*dt;this.bulges=this.bulges.filter(g=>g.pos<1.08);
    const tail=this.pts[this.pts.length-1];
    for(const c of this.contrail)c.age+=dt;this.contrail=this.contrail.filter(c=>c.age<0.5);
    if(this.bvis>0.08)this.contrail.push({x:tail.x,y:tail.y,age:0});
    this.trapT=this.flags.trapped?Math.min(1,this.trapT+dt*3):Math.max(0,this.trapT-dt*2);
    void k;
  }
}
const colOf=s=>PAL[s.ci%PAL.length];
const phased=s=>s.effect&&s.effect.kind==='phase';
function tierOf(s){if(s.tier)return s.tier;const n=s.len;return n<24?'hatch':n<100?'adult':n<250?'elder':'titan';}
// one 4-bit mood per head, highest priority wins (spec: ideas.md, Faces)
function moodOf(s){
  if(s.forceMood)return s.forceMood;
  if(s.frozen>0)return 'frozen';
  if(s.dizzy>0)return 'dizzy';
  if(s.flags.trapped||s.trapT>0.3)return 'trapped';
  if(s.happy>0)return 'happy';
  if(s.angry>0)return 'angry';
  if(s.scared>0)return 'scared';
  if(s.flags.hunting)return 'hunting';
  if(s.sleepy>0)return 'sleepy';
  return 'calm';
}

function wanderPath(x,y,a,L,b){
  const pts=[{x,y}],step=4;let ang=a,turn=0;
  for(let d=0;d<L;d+=step){turn=clamp(turn+(rnd()-.5)*0.12,-0.08,0.08);
    const m=60,cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2;
    if(x<b.x0+m||x>b.x1-m||y<b.y0+m||y>b.y1-m){const want=Math.atan2(cy-y,cx-x);ang+=clamp(norm(want-ang),-0.12,0.12);}
    ang+=turn;x+=Math.cos(ang)*step;y+=Math.sin(ang)*step;pts.push({x,y});}
  return{pts,angle:ang};
}
function circlePath(C,R,len,sp,gap,dir=1){
  const L=(len+8)*sp,pts=[];const ang=L/R;
  for(let a=ang;a>=0;a-=2/R){const rr=R+gap*a/TAU;const th=-dir*a;pts.push({x:C.x+Math.cos(th)*rr,y:C.y+Math.sin(th)*rr});}
  return pts;
}
function mkWander(o){const b=o.b||rect(60,90,W.w-60,W.h-60);
  const wp=wanderPath(o.x,o.y,o.a??rnd()*TAU,(o.len+8)*W.R0*1.5,b);
  return new Snake(Object.assign({path:wp.pts,angle:wp.angle},o));}

// ================================================================ food, items, zones
function addFood(o){
  const f=Object.assign({x:0,y:0,vx:0,vy:0,kind:'spark',ci:0,value:0.6,life:40,phase:rnd()*TAU,owner:null,att:0,tx:0,ty:0,rot:rnd()*TAU},o);
  f.maxLife=f.life;const R0=W.R0;

function addAmbient(b){b=b||rect(30,70,W.w-30,W.h-30);

const ITEM_W={magnet:24,surge:20,venom:16,phase:12,frost:10,flip:10,whirl:8};
function randomKind(){let s=0;for(const k in ITEM_W)s+=ITEM_W[k];let r=rnd()*s;for(const k in ITEM_W){r-=ITEM_W[k];if(r<=0)return k;}return 'magnet';}
let IID=0;
function spawnItem(kind,x,y,extra){
  const it=Object.assign({id:IID++,kind,x,y,age:0,life:25,incoming:1.0,big:true,isItem:true},extra||{});it.accent=ACC[kind];
  W.items.push(it);if(it.incoming<=0)W.fx.push({type:'ring',x,y,r0:W.R0*7,r1:W.R0*2.2,t:0,dur:0.5,c:ACC[kind],lw:1.2});return it;}
function openSpot(b,tries=14){let best=null,bs=-1;
  for(let k=0;k<tries;k++){const x=b.x0+rnd()*(b.x1-b.x0),y=b.y0+rnd()*(b.y1-b.y0);let m=1e9;
    for(const s of W.snakes){if(!s.alive)continue;for(let i=0;i<s.pts.length;i+=3){const p=s.pts[i];m=Math.min(m,Math.hypot(p.x-x,p.y-y));}}
    for(const it of W.items)m=Math.min(m,Math.hypot(it.x-x,it.y-y)*0.6);
    if(m>bs){bs=m;best={x,y};}}return best;}
function goalAlive(g){if(!g)return false;if(g.isItem)return W.items.includes(g);if(g.isZone)return W.zones.includes(g);return W.food.includes(g);}

// grid
function buildGrid(){W.grid.clear();const C=W.cell;
  for(const s of W.snakes){if(!s.alive)continue;const p=s.pts;
    for(let i=0;i<p.length;i++){const k=(Math.floor(p[i].x/C)+2000)+(Math.floor(p[i].y/C)+2000)*8192;let a=W.grid.get(k);if(!a){a=[];W.grid.set(k,a);}a.push(s,i);}}}
function forNear(x,y,rad,fn){const C=W.cell;const x0=Math.floor((x-rad)/C),x1=Math.floor((x+rad)/C),y0=Math.floor((y-rad)/C),y1=Math.floor((y+rad)/C);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=W.grid.get((cx+2000)+(cy+2000)*8192);if(!a)continue;for(let j=0;j<a.length;j+=2)fn(a[j],a[j+1]);}}

// ================================================================ emotes
function emote(s,glyph,opt={}){
  if(!s||!s.alive)return;
  const gap=W.scene.emoteGap??5;
  if(!opt.force&&W.t-s.emoteAt<gap)return;
  if(opt.force)W.bubbles=W.bubbles.filter(b=>b.s!==s);
  else if(W.bubbles.some(b=>b.s===s&&b.t<b.dur*0.5))return;
  const cap=W.scene.maxBubbles||3;
  if(W.bubbles.length>=cap){if(!opt.force)return;W.bubbles.shift();}
  W.bubbles.push({s,glyph,t:0,dur:1.5,c:opt.c||null});s.emoteAt=W.t;

// ================================================================ steering helpers
const OFFS=[-1.3,-0.9,-0.55,-0.25,0,0.25,0.55,0.9,1.3];
const PROBES=[[2.2,1.5],[4.5,1],[8,0.5]];
function clearance(s,x,y,ignore){
  const b=s.bounds||arena();let m=s.noWalls?1e9:Math.min(x-b.x0,b.x1-x,y-b.y0,b.y1-y);
  if(!ignore)forNear(x,y,s.r*5,(o,i)=>{if(o===s||!o.alive||phased(o)||phased(s))return;
    if(s.venomTarget===o&&i>o.len*0.5)return;if(s.headOnTarget===o&&i<=2)return;
    const q=o.pts[i];if(!q)return;const d=Math.hypot(q.x-x,q.y-y)-o.r;if(d<m)m=d;});
  return m;
}
function avoidSteer(s,want,ignore){
  const h=s.pts[0];let best=want,bs=-1e9,blocked=0;const cands=OFFS.map(o=>s.angle+o);cands.push(want);
  for(const a of cands){let pen=0;const ca=Math.cos(a),sa=Math.sin(a);
    for(const [d,wt] of PROBES){const c=clearance(s,h.x+ca*d*s.r,h.y+sa*d*s.r,ignore)-s.r;if(c<2.5*s.r)pen+=wt*(2.5*s.r-c)/(2.5*s.r);}
    if(pen>1.4)blocked++;const sc=Math.cos(norm(a-want))-pen*(s.len>=90?3:1.8);if(sc>bs){bs=sc;best=a;}}
  s.blockedFrac=blocked/cands.length;return best;
}
const angTo=(h,p)=>Math.atan2(p.y-h.y,p.x-h.x);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function interceptPoint(s,prey,ahead){
  const h=s.pts[0],ph=prey.pts[0],dx=Math.cos(prey.angle),dy=Math.sin(prey.angle);let d=Math.hypot(ph.x-h.x,ph.y-h.y),P=ph;
  for(let k=0;k<3;k++){const tau=d/(s.speed()*(s.boost.state===1?1:1.3));const L=prey.speed()*tau+ahead*prey.r;
    P={x:ph.x+dx*L,y:ph.y+dy*L};d=Math.hypot(P.x-h.x,P.y-h.y);}
  return{P,dist:d};
}
// ETA in seconds: straight distance plus the time to swing the heading round
function eta(s,p){const h=s.pts[0];const d=dist(h,p);const turn=Math.abs(norm(angTo(h,p)-s.angle));return d/s.speed()+turn/Math.max(0.5,s.turnRate());}
function rivalEta(s,p){let best=1e9,who=null;for(const o of W.snakes){if(o===s||!o.alive||o.frozen>0)continue;const e=eta(o,p);if(e<best){best=e;who=o;}}return{e:best,who};}
function orbitPoint(s,C,R,dir=1){const h=s.pts[0];const phi=Math.atan2(h.y-C.y,h.x-C.x)+dir*0.55;return{x:C.x+Math.cos(phi)*R,y:C.y+Math.sin(phi)*R};}
function steerTo(s,p,boost=false,ignore=false){return{angle:avoidSteer(s,angTo(s.pts[0],p),ignore),boost};}
function wanderTo(s,b){const h=s.pts[0];b=b||rect(80,110,W.w-80,W.h-80);
  if(!s.wp||dist(s.wp,h)<4*s.r||rnd()<0.003)s.wp={x:b.x0+rnd()*(b.x1-b.x0),y:b.y0+rnd()*(b.y1-b.y0)};return s.wp;}

// value of a big target for this snake (items, prism, starfall zones); the race filter happens in ecoBrain
function itemValue(s,it){
  const base={surge:6,magnet:4,phase:3,venom:5,frost:3,flip:4,whirl:4}[it.kind];let v=base;const h=s.pts[0];
  if(it.kind==='phase'&&(s.flags.trapped||s.blockedFrac>0.5))v+=12;
  if(it.kind==='frost'){for(const o of W.snakes)if(o!==s&&o.alive&&dist(o.pts[0],it)<16*W.R0)v+=8;}
  if(it.kind==='venom'){for(const o of W.snakes)if(o!==s&&o.alive&&o.len>s.len*1.5&&dist(o.pts[0],h)<30*s.r){v+=5;break;}}
  if(it.kind==='surge'){for(const o of W.snakes)if(o!==s&&o.alive&&o.len<s.len*0.75&&dist(o.pts[0],h)<25*s.r){v+=6;break;}}
  if(it.kind==='flip'&&s.len>=40)v+=2;
  if(it.kind==='whirl'){let n=0;for(const f of W.food)if(dist(f,it)<22*W.R0)n++;v+=n*0.12;}
  if(s.effect&&s.effect.t>2)v*=0.35; // already powered: picking up would waste the active effect
  return v;

// ================================================================ the generic "smart" brain (Chaos, background extras)
function ecoBrain(s,dt){
  const h=s.pts[0];s.think=(s.think||0)-dt;
  // goal vanished: denied (angry, grudge) when close, puzzled when far
  if(s.goal&&!goalAlive(s.goal)){const g=s.goal;s.goal=null;
    if(g.takenBy&&g.takenBy!==s&&g.big){if(dist(g,h)<13*s.r){s.angry=2.6;s.grudge=g.takenBy;s.grudgeT=5;emote(s,'anger');}else emote(s,'ask');}}
  if(s.prey&&(!s.prey.alive||W.t>s.huntUntil||s.prey.gen!==s.preyGen))s.prey=null;
  // Flip: hold the charge; fire when trapped, or to ambush a tail-chaser we out-length
  if(s.flipCharge>0){
    if(s.flags.trapped)return{angle:s.angle,flip:true};
    const tail=s.pts[s.pts.length-1];
    for(const o of W.snakes){if(o===s||!o.alive)continue;const oh=o.pts[0];
      if(dist(oh,tail)<6*s.r&&s.len>=o.len+4&&Math.cos(norm(angTo(oh,tail)-o.angle))>0.7)return{angle:s.angle,flip:true};}
  }
  // Whirlpool owner: orbit the vortex until it bursts
  const vx=W.vortices.find(v=>v.owner===s);
  if(s.think<=0){s.think=0.3+rnd()*0.25;
    s.sleepy=(W.night>0.55&&!s.prey&&!(s.goal&&s.goal.big))?1:0;
    if(s.grudge&&s.grudgeT>0&&s.grudge.alive&&s.grudge.len<s.len*1.2&&!s.prey){s.prey=s.grudge;s.preyGen=s.grudge.gen;s.huntUntil=W.t+s.grudgeT;}
    if(!s.prey&&s.frostHunt>0){let best=null,bd=1e9;for(const o of W.snakes){if(o===s||!o.alive||o.frozen<=0)continue;const d=dist(o.pts[0],h);if(d<bd){bd=d;best=o;}}
      if(best){s.prey=best;s.preyGen=best.gen;s.huntUntil=W.t+2.5;}}
    s.venomTarget=null;
    if(s.effect&&s.effect.kind==='venom'){let best=null,bd=1e9;for(const o of W.snakes){if(o===s||!o.alive||o.len<s.len*1.3)continue;const d=dist(o.pts[0],h);if(d<bd&&d<40*s.r){bd=d;best=o;}}s.venomTarget=best;}
    if(!s.prey&&!s.venomTarget&&s.len>=34&&rnd()<0.15){let best=null,bd=1e9;
      for(const o of W.snakes){if(o===s||!o.alive||o.len>s.len*0.75)continue;const d=dist(o.pts[0],h);if(d<28*s.r&&d<bd){bd=d;best=o;}}
      if(best){s.prey=best;s.preyGen=best.gen;s.huntUntil=W.t+5;}}
    // targets: ordinary food by value/distance; big targets (items, prism, zones) only if we can win the race
    let best=null,bv=0;
    for(const f of W.food){if(f.inV||f.kind==='seed')continue;const d=dist(f,h);if(d>34*s.r&&!f.big)continue;const v=(f.kind==='prism'?9:f.value)/(d+20);if(v>bv){bv=v;best=f;}}
    const bigs=[...W.items,...W.food.filter(f=>f.kind==='seed'||f.kind==='prism'),...W.zones];
    for(const T of bigs){const d=dist(T,h);if(d>60*s.r)continue;
      let v=(T.isItem?itemValue(s,T):T.isZone?7:9);
      const mine=eta(s,T),riv=rivalEta(s,T);
      if(riv.e<mine*0.8)v*=0.2; // we would lose: leave it (or abort below)
      v/=(d+20);if(v>bv){bv=v;best=T;}}
    if(best!==s.goal){
      if(best&&best.big&&!(s.goal&&s.goal.big))emote(s,'bang',{c:best.accent});
      else if(s.goal&&s.goal.big&&!(best&&best.big)&&goalAlive(s.goal))emote(s,'ask');
      s.goal=best;}
    if(!best)wanderTo(s);
  }
  s.flags.hunting=!!s.prey||!!s.venomTarget;
  let want,boost=false;
  if(vx&&vx.t<vx.dur){want=angTo(h,orbitPoint(s,vx,9*s.r));}
  else if(s.venomTarget){const v=s.venomTarget;const p=v.pts[Math.floor(v.len*0.8)];want=angTo(h,p);if(dist(p,h)<5*s.r)s.strike=0.3;}
  else if(s.prey){const{P,dist:d}=interceptPoint(s,s.prey,4);want=angTo(h,P);boost=d<14*s.r&&Math.abs(norm(want-s.angle))<0.5&&(s.len>=16);}
  else if(s.goal&&goalAlive(s.goal)){const g=s.goal;
    if(g.kind==='seed'&&dist(g,h)<7*s.r)want=angTo(h,orbitPoint(s,g,5*s.r));   // circle like a vulture until it ripens
    else if(g.isItem&&g.incoming>0&&dist(g,h)<6*s.r)want=angTo(h,orbitPoint(s,g,4*s.r));
    else want=angTo(h,g);
    if(g.big){const riv=rivalEta(s,g);const mine=eta(s,g);

  else want=angTo(h,s.wp||{x:W.w/2,y:W.h/2});
  const a=avoidSteer(s,want);
  s.flags.trapped=s.blockedFrac>0.75;
  if(s.effect&&s.effect.kind==='surge'&&Math.abs(norm(want-s.angle))<0.4)boost=true;
  // scared when a hunter has us as prey and is close
  for(const o of W.snakes){if(o===s||!o.alive)continue;if((o.prey===s||o.venomTarget===s)&&dist(o.pts[0],h)<14*o.r){s.scared=Math.max(s.scared,0.4);break;}}
  if(s.sleepy>0&&W.t>s.yawnAt){s.yawn=1.3;s.yawnAt=W.t+5+rnd()*7;emote(s,'zz');}
  return{angle:a,boost};
}

// ================================================================ collisions, death, venom, flip
function snapshot(pts,r,tap=true,wFn){const n=pts.length,G={p:pts.map(p=>({x:p.x,y:p.y})),n,nx:new Float32Array(n),ny:new Float32Array(n),tx:new Float32Array(n),ty:new Float32Array(n),w:new Float32Array(n)};
  fillGeom(G,r,tap,false,null,wFn);return G;}
function fillGeom(G,r,tap,breath,bulges,wFn){const p=G.p,n=G.n;
  for(let i=0;i<n;i++){const a=p[i>0?i-1:0],b=p[i<n-1?i+1:n-1];let dx=a.x-b.x,dy=a.y-b.y;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
    G.tx[i]=dx;G.ty[i]=dy;G.nx[i]=-dy;G.ny[i]=dx;
    G.w[i]=r*(wFn?wFn(i):tap?taper(n>1?i/(n-1):0):1)*(breath&&!state.calm?1+0.028*Math.sin(VT*2.4-i*0.32):1);}
  if(bulges)for(const g of bulges){const c=g.pos*(n-1);for(let i=Math.max(0,Math.floor(c-6));i<=Math.min(n-1,Math.ceil(c+6));i++){const z=(i-c)/2.1;G.w[i]*=1+0.35*Math.exp(-z*z);}}
}
function burst(pts,s,from,to,ci){
  const len=to-from;const n=clamp(Math.round(len*0.85),6,140);
  for(let j=0;j<n;j++){const pos=from+(n>1?j*(len-1)/(n-1):0);const lo=Math.floor(pos),hi=Math.min(to-1,lo+1),fr=pos-lo;
    const a=pts[lo],b=pts[hi];const ang=rnd()*TAU,force=(22+rnd()*90)*W.R0/9;
    addFood({kind:'shard',ci:ci??s.ci,x:a.x+(b.x-a.x)*fr+(rnd()-.5)*s.r,y:a.y+(b.y-a.y)*fr+(rnd()-.5)*s.r,vx:Math.cos(ang)*force,vy:Math.sin(ang)*force,
      value:Math.max(0.65,len/n)*(0.8+rnd()*0.4),life:18+rnd()*16});}
}
function gulp(s){const n=Math.max(8,s.len);s.bulges.push({pos:0,spd:clamp(26/n,0.28,1.0)});if(s.bulges.length>2)s.bulges.shift();}
function kill(s,at,killer,headOn){
  if(!s.alive||s.immune)return;s.alive=false;s.respawn=W.scene.respawn?2.6+rnd()*2.4:Infinity;
  W.corpses.push({G:snapshot(s.pts,s.r),c:lifted(colOf(s)),t:0,dur:0.55/calmK()*calmK(),r:s.r});
  W.fx.push({type:'impact',x:at.x,y:at.y,t:0,dur:0.5,c:colOf(s),r:s.r,seed:rnd()*100});
  burst(s.pts,s,0,s.pts.length);
  if(killer&&killer.alive){killer.killGlow=1;killer.waves.push({pos:0,spd:1.1,c:mix(colOf(killer),WHITE,.7),str:1,w:9});
    killer.happy=1.5;killer.blep=0.9;if(headOn)gulp(killer);}
  for(const o of W.snakes){if(o===s||o===killer||!o.alive)continue;if(dist(o.pts[0],at)<12*o.r&&(!killer||o.len<killer.len))o.scared=Math.max(o.scared,1.2);}
  if(W.leader===s)W.leader=null;W.sd.killAt=W.sd.killAt||W.sceneT;
}
function sever(b,i,a,q){
  // the cut piece becomes a wriggling orphan tail (renderer-only), then bursts into essence
  const cut=b.pts.slice(i).map(p=>({x:p.x,y:p.y})),n0=b.len;
  const ws=cut.map((_,j)=>taper((i+j)/Math.max(1,n0-1)));
  W.orphans.push({pts:cut,ws,r:b.r,c:lifted(colOf(b)),ci:b.ci,t:0,dur:1.1,tier:tierOf(b),from:i});
  b.len=i;b.place();b.stump=1.6;b.angry=3;b.grudge=a;b.grudgeT=5;emote(b,'anger',{force:true});
  W.fx.push({type:'impact',x:q.x,y:q.y,t:0,dur:0.5,c:ACC.venom,r:b.r,seed:rnd()*100});
  a.effect=null;a.killGlow=1;a.happy=1.4;a.blep=0.9;a.strike=0;a.venomTarget=null;a.waves.push({pos:0,spd:1.2,c:ACC.venom,str:1,w:8});
  W.sd.biteAt=W.sceneT;
}
function doFlip(s){
  const old=s.pts.map(p=>({x:p.x,y:p.y})),n=old.length;
  const h0=old[0],t0=old[n-1];
  s.layPath(old); // head is now the old tail tip
  s.angle=Math.atan2(old[n-1].y-old[n-2].y,old[n-1].x-old[n-2].x);s.desired=s.angle;
  s.contrail=[];s.waves=[{pos:0,spd:3.2,c:mix(ACC.flip,WHITE,.5),str:1,w:6}];
  s.flipCharge=0;s.effect=null;s.dizzy=1.0;s.wp=null;
  W.fx.push({type:'ring',x:h0.x,y:h0.y,r0:s.r,r1:s.r*4,t:0,dur:0.4,c:ACC.flip,lw:1.4});
  W.fx.push({type:'ring',x:t0.x,y:t0.y,r0:s.r*4,r1:s.r*1.2,t:0,dur:0.4,c:ACC.flip,lw:1.6});
  W.sd.flipAt=W.sceneT;
}
function collisions(){
  if(W.sceneT<(W.scene.grace??1.2))return;
  for(const a of W.snakes){if(!a.alive)continue;const h=a.pts[0];let hit=null;
    forNear(h.x,h.y,a.r*3,(b,i)=>{if(hit||b===a||!b.alive)return;const q=b.pts[i];if(!q)return;
      const rr=(a.r+b.r*taper(i/Math.max(1,b.len-1)))*0.82;if((q.x-h.x)**2+(q.y-h.y)**2<rr*rr)hit={b,i,q};});
    if(!hit)continue;const{b,i,q}=hit;
    if(phased(a)||phased(b))continue;
    if(a.effect&&a.effect.kind==='venom'&&i>b.len*0.5&&i>3){sever(b,i,a,q);continue;}
    if(!W.scene.lethal)continue;
    if(i<=1){if(a.len>=b.len+4)kill(b,q,a,true);else if(b.len>=a.len+4)kill(a,q,b,true);else{kill(a,q,b);kill(b,q,a);}}
    else kill(a,{x:(h.x+q.x)/2,y:(h.y+q.y)/2},b);
  }
}
function respawnSnake(s){
  const p=openSpot(rect(80,100,W.w-80,W.h-80));const len=14+Math.floor(rnd()*10);
  const wp=wanderPath(p.x,p.y,rnd()*TAU,(len+8)*W.R0*1.5,rect(50,80,W.w-50,W.h-50));
  s.len=len;s.alive=true;s.gen=(s.gen||0)+1;s.angle=wp.angle;s.effect=null;s.frozen=0;s.waves=[];s.contrail=[];s.prey=null;s.growth=0;
  s.bulges=[];s.flipCharge=0;s.goal=null;s.grudge=null;s.happy=s.angry=s.scared=s.dizzy=s.stump=0;
  s.boost={state:0,t:0,el:0,shed:0,cost:2};s.layPath(wp.pts);s.spawnT=W.t;
}

// ================================================================ update
function updateFood(dt){
  const damp=Math.pow(0.16,dt),scale=W.R0/10.8;
  for(let i=W.food.length-1;i>=0;i--){const f=W.food[i];
    if(f.kind==='seed'){f.ripe-=dt;if(f.ripe<=0){f.kind='prism';f.life=30;f.maxLife=30;
        W.fx.push({type:'ring',x:f.x,y:f.y,r0:f.size*1.2,r1:f.size*5,t:0,dur:0.5,c:WHITE,lw:1.4});}continue;}
    if(!f.static){f.life-=dt;if(f.life<=0){W.food.splice(i,1);continue;}}
    if(f.fadeIn!==undefined)f.fadeIn=Math.min(1,f.fadeIn+dt*3);
    if(Math.abs(f.vx)+Math.abs(f.vy)>0.1){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=damp;f.vy*=damp;
      if(f.x<3||f.x>W.w-3){f.x=clamp(f.x,3,W.w-3);f.vx*=-0.45;}if(f.y<3||f.y>W.h-3){f.y=clamp(f.y,3,W.h-3);f.vy*=-0.45;}}
    f.att=0;if(W.scene.noEat||f.inV)continue;
    let eater=null,best=1e18;
    if(f.owner&&f.owner.alive){eater=f.owner;const h=eater.pts[0];best=(f.x-h.x)**2+(f.y-h.y)**2;}
    else{f.owner=null;for(const s of W.snakes){if(!s.alive||s.noEat)continue;const h=s.pts[0];const reach=s.r*((s.effect&&s.effect.kind==='magnet')?9:3)+f.size;
      const dx=f.x-h.x,dy=f.y-h.y;if(Math.abs(dx)>reach||Math.abs(dy)>reach)continue;const d2=dx*dx+dy*dy;if(d2<=reach*reach&&d2<best){best=d2;eater=s;}}}
    if(!eater)continue;
    const h=eater.pts[0],dd=Math.sqrt(best),eatR=eater.r*1.16+f.size;f.owner=eater;f.vx=f.vy=0;
    const done=()=>{eater.eat(f.value);f.takenBy=eater;W.food.splice(i,1);if(f.kind==='prism')feast(eater,f);};
    if(dd<=eatR){done();continue;}
    const pull=clamp(1-(dd-eatR)/(eater.r*1.84),0.08,1);const sp=Math.max((240+pull*420)*scale,eater.speed()*1.8);const tr=Math.min(dd-eatR,sp*dt);
    if(tr>=dd-eatR-0.01){done();continue;}
    f.x+=(h.x-f.x)/dd*tr;f.y+=(h.y-f.y)/dd*tr;f.att=pull;f.tx=h.x;f.ty=h.y;
  }
  if(!W.scene.noAmbient)for(let k=0;k<3&&W.food.length<W.foodTarget;k++)addAmbient();
}
function feast(s,f){ // prism eaten: gulp bulge + rainbow wave + heart

// one reaction per event: only the nearest committed loser gets angry (and a grudge); the rest stay quiet
function denied(winner,T){let best=null,bd=1e9;
  for(const o of W.snakes){if(o===winner||!o.alive||o.goal!==T)continue;const d=dist(o.pts[0],T);if(d<bd){bd=d;best=o;}}
  if(best&&bd<13*best.r){best.angry=2.6;best.grudge=winner;best.grudgeT=5;emote(best,'anger',{force:true});}
  for(const o of W.snakes)if(o.goal===T)o.goal=null;}
function applyPowerup(s,it){

function updateItems(dt){

function updateVortices(dt){
  for(const f of W.food)f.inV=false;
  for(let k=W.vortices.length-1;k>=0;k--){const v=W.vortices[k];v.t+=dt;
    const pullT=v.dur-0.4;
    for(let i=W.food.length-1;i>=0;i--){const f=W.food[i];if(f.static||f.kind==='seed'||f.kind==='prism')continue;
      let dx=f.x-v.x,dy=f.y-v.y;let r=Math.hypot(dx,dy);if(r>v.R||v.t>pullT)continue;
      f.inV=true;f.owner=null;f.vx=f.vy=0;f.life=Math.max(f.life,6);
      const q=1-r/v.R;const w=state.calm?0:(0.5+1.9*q);const vr=v.R/4.0*(0.55+0.6*q);
      const a=Math.atan2(dy,dx)+w*dt;r=Math.max(0,r-vr*dt);
      if(r<W.R0*0.9){v.col+=f.value;W.food.splice(i,1);continue;}
      f.x=v.x+Math.cos(a)*r;f.y=v.y+Math.sin(a)*r;}
    if(v.t>=v.dur){W.vortices.splice(k,1);
      const n=clamp(Math.round(v.col/0.7)+10,12,46),val=(v.col+6)/n;
      for(let j=0;j<n;j++){const a=j/n*TAU+rnd()*0.2,sp=(70+rnd()*60)*W.R0/9;
        addFood({kind:'shard',ci:j%6,x:v.x+Math.cos(a)*W.R0,y:v.y+Math.sin(a)*W.R0,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,value:val,life:14+rnd()*6});}
      W.fx.push({type:'ring',x:v.x,y:v.y,r0:W.R0*1.5,r1:W.R0*9,t:0,dur:0.6,c:v.accent,lw:2});
      W.fx.push({type:'flash',x:v.x,y:v.y,t:0,dur:0.45,c:v.accent,r:W.R0});

  }
}

function updateLeader(){

function prismBrain(s){const h=s.pts[0],g=s.goal;
  if(g&&goalAlive(g)){

// ================================================================ rendering
const LX=-0.55,LY=-0.83;
const nightK=()=>1-0.72*W.night;
function ribbon(c,G,k,shift=0,from=0,to=G.n-1,roundTail=false){
  const{p,nx,ny,tx,ty,w}=G;c.beginPath();
  for(let i=from;i<=to;i++){const o=shift?(nx[i]*LX+ny[i]*LY)*w[i]*shift:0,ww=w[i]*k;c.lineTo(p[i].x+nx[i]*(ww+o),p[i].y+ny[i]*(ww+o));}
  const e=to,oe=shift?(nx[e]*LX+ny[e]*LY)*w[e]*shift:0;
  if(roundTail){const a=Math.atan2(ty[e],tx[e]);c.arc(p[e].x+nx[e]*oe,p[e].y+ny[e]*oe,w[e]*k,a+PI/2,a+PI*1.5,false);}
  else c.lineTo(p[e].x-tx[e]*w[e]*k*1.1+nx[e]*oe,p[e].y-ty[e]*w[e]*k*1.1+ny[e]*oe);
  for(let i=to;i>=from;i--){const o=shift?(nx[i]*LX+ny[i]*LY)*w[i]*shift:0,ww=w[i]*k;c.lineTo(p[i].x-nx[i]*(ww-o),p[i].y-ny[i]*(ww-o));}
  const a0=Math.atan2(ty[from],tx[from]),o0=shift?(nx[from]*LX+ny[from]*LY)*w[from]*shift:0;
  c.arc(p[from].x+nx[from]*o0,p[from].y+ny[from]*o0,w[from]*k,a0-PI/2,a0+PI/2,false);c.closePath();
}
function drawBackground(){const[g0,g1]=BGS[state.bg];
  if(g0===g1){ctx.fillStyle=g0;ctx.fillRect(0,0,W.w,W.h);}
  else{const gr=ctx.createLinearGradient(0,0,0,W.h);gr.addColorStop(0,g0);gr.addColorStop(1,g1);ctx.fillStyle=gr;ctx.fillRect(0,0,W.w,W.h);}
  if(W.night>0){ctx.fillStyle=`rgba(0,0,0,${0.6*W.night})`;ctx.fillRect(0,0,W.w,W.h);}
}
function fadeOf(f){let a=1;if(!(f.static&&!f.demoExpire)&&f.kind!=='seed'&&f.life<3){const u=f.life/3;a=u*(0.65+0.35*Math.sin(VT*18+f.phase));}if(f.fadeIn!==undefined)a*=f.fadeIn;return a;}
function drawFood(){
  const t=VT,nb=1+0.6*W.night;
  ctx.globalCompositeOperation='lighter';
  for(const f of W.food){const col=lifted(PAL[f.ci%6]);const fade=fadeOf(f);
    if(f.att>0){const dx=f.tx-f.x,dy=f.ty-f.y,L=Math.hypot(dx,dy)||1,tl=f.size*(3+f.att*8);
      const g=ctx.createLinearGradient(f.x,f.y,f.x-dx/L*tl,f.y-dy/L*tl);g.addColorStop(0,rgba(mix(col,WHITE,.4),.75*fade));g.addColorStop(1,rgba(col,0));
      ctx.strokeStyle=g;ctx.lineWidth=f.size*1.3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x-dx/L*tl,f.y-dy/L*tl);ctx.stroke();}
    const tw=state.calm?1:0.85+0.15*Math.sin(t*2.2+f.phase);
    if(f.kind==='spark')glow(ctx,f.x,f.y,f.size*4.6,col,0.42*tw*fade*nb);
    else if(f.kind==='shard')glow(ctx,f.x,f.y,f.size*4.4,col,(0.42+0.18*(state.calm?0:Math.sin(t*7+f.phase)))*fade*nb);
    else if(f.kind==='pellet')glow(ctx,f.x,f.y,f.size*3,col,0.16*fade*nb);
    else if(f.kind==='prism')glow(ctx,f.x,f.y,f.size*4,mix(col,WHITE,.3),0.55*tw*nb);
    else if(f.kind==='seed'){const k=1-f.ripe/f.ripeDur;glow(ctx,f.x,f.y,f.size*(2+2.2*k),WHITE,(0.18+0.3*k)*nb);}
    else if(f.kind==='star')glow(ctx,f.x,f.y,f.size*5,mix(GOLD,WHITE,.35),0.5*tw*fade*nb);
  }
  ctx.globalCompositeOperation='source-over';
  for(const f of W.food){const col=lifted(PAL[f.ci%6]);const fade=fadeOf(f),s=f.size;
    if(f.kind==='spark'){ctx.fillStyle=rgba(mix(col,WHITE,.2),fade);ctx.beginPath();ctx.arc(f.x,f.y,s*1.05,0,TAU);ctx.fill();
      ctx.fillStyle=rgba(WHITE,.85*fade);ctx.beginPath();ctx.arc(f.x-s*.15,f.y-s*.2,s*.45,0,TAU);ctx.fill();}
    else if(f.kind==='shard'){const a=f.rot+(state.calm?0:t*0.8)+f.phase,c=Math.cos(a),sn=Math.sin(a);
      const P=(u,v)=>[f.x+c*u-sn*v,f.y+sn*u+c*v];const q=[P(0,-s*1.6),P(s*.85,0),P(0,s*1.6),P(-s*.85,0)];
      ctx.beginPath();q.forEach((z,i)=>i?ctx.lineTo(z[0],z[1]):ctx.moveTo(z[0],z[1]));ctx.closePath();
      ctx.fillStyle=rgba(mix(col,WHITE,.3),fade);ctx.fill();
      ctx.beginPath();ctx.moveTo(...q[0]);ctx.lineTo(...q[1]);ctx.lineTo(f.x,f.y);ctx.closePath();ctx.fillStyle=rgba(WHITE,.55*fade);ctx.fill();}
    else if(f.kind==='pellet'){ctx.fillStyle=rgba(col,.55*fade);ctx.beginPath();ctx.arc(f.x,f.y,s,0,TAU);ctx.fill();}
    else if(f.kind==='prism')drawPrism(f.x,f.y,s,col,1,1);
    else if(f.kind==='seed'){const k=1-f.ripe/f.ripeDur;drawPrism(f.x,f.y,s*(0.4+0.45*k),col,0.6+0.4*k,k);
      // ripening ring: fills clockwise from the top
      ctx.strokeStyle=rgba(WHITE,0.18);ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(f.x,f.y,s*2.7,0,TAU);ctx.stroke();
      ctx.strokeStyle=rgba(mix(col,WHITE,.6),0.85);ctx.lineWidth=1.8;ctx.lineCap='round';ctx.beginPath();ctx.arc(f.x,f.y,s*2.7,-PI/2,-PI/2+TAU*k);ctx.stroke();}
    else if(f.kind==='star'){const q=state.calm?0.6:0.6+0.4*Math.sin(t*3+f.phase);const gc=mix(GOLD,WHITE,.45);
      ctx.fillStyle=rgba(gc,fade);ctx.beginPath();ctx.arc(f.x,f.y,s,0,TAU);ctx.fill();
      ctx.strokeStyle=rgba(WHITE,.7*q*fade);ctx.lineWidth=0.9;const L=s*3.2*q;ctx.beginPath();ctx.moveTo(f.x-L,f.y);ctx.lineTo(f.x+L,f.y);ctx.moveTo(f.x,f.y-L);ctx.lineTo(f.x,f.y+L);ctx.stroke();}
  }
}
function drawPrism(x,y,s,col,a,ring){
  const g=ctx.createRadialGradient(x-s*.3,y-s*.35,s*.1,x,y,s);g.addColorStop(0,'#fff');g.addColorStop(.45,rgba(mix(col,WHITE,.4)));g.addColorStop(1,rgba(mix(col,BLACK,.25)));
  ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,s,0,TAU);ctx.fill();
  if(ring>0.05){ctx.save();ctx.translate(x,y);ctx.rotate(state.calm?0.4:VT*0.5);ctx.strokeStyle=rgba(mix(col,WHITE,.6),.7*ring);ctx.lineWidth=1.1;ctx.beginPath();ctx.ellipse(0,0,s*1.9,s*.6,0,0,TAU);ctx.stroke();

  for(const s of W.snakes){if(!s.alive)continue;v+=(s.len-1)*6+6+(s.contrail.length?Math.min(s.contrail.length,15)*6:0)+(s.effect?6:0);}
  for(const f of W.food)v+=6+(f.att>0?6:0);
  v+=W.items.length*6+W.fx.length*6;for(const c of W.corpses)v+=c.G.n*6;
  extra+=W.bubbles.length*6;
  for(const T of[...W.items,...W.food.filter(f=>f.kind==='seed'||f.kind==='prism')]){let n=0;for(const s of W.snakes)if(s.alive&&s.goal===T)n++;extra+=Math.min(2,n)*6;}
  extra+=W.vortices.length*6+W.zones.length*6+W.meteors.filter(m=>m.t>=0).length*12;
  for(const o of W.orphans)extra+=(o.pts.length-1)*6;
  return{v:v+extra,extra};
}
const k1=v=>v>=1000?(v/1000).toFixed(1)+'k':String(v);

// ================================================================ frame
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);drawBackground();
  drawZones();drawVortices();drawFood();drawItems();drawContest();
  for(const c of W.corpses)drawCorpse(c);for(const o of W.orphans)drawOrphan(o);
  for(const s of W.snakes)if(s.alive)drawSnake(s);
  drawFx();drawBubbles();drawLabels();
  const L=W.scene.loop;let fade=Math.max(0,1-W.sceneT/0.4);if(L)fade=Math.max(fade,clamp((W.sceneT-(L-0.4))/0.4,0,1));
  if(fade>0){ctx.fillStyle=`rgba(0,0,0,${fade})`;ctx.fillRect(0,0,W.w,W.h);}
}
let lastTs=0,capT=0;
function frame(ts){const dt=Math.min(0.05,(ts-lastTs)/1000||0);lastTs=ts;
  if(!state.paused){update(dt);if(!state.calm)W.vt+=dt;}VT=W.vt;render();
  capT-=dt;if(capT<=0){capT=0.25;updateCaption();}
  requestAnimationFrame(frame);}

// ================================================================ UI
const $=id=>document.getElementById(id);
let FZ=+new URLSearchParams(location.hash.slice(1)).get('z')||0; // debug: scale every scene's snakes
const SEEDS={faces:2,race:5,venom:3,frost:4,prism:9,flip:6,whirl:8,events:12,chaos:11};
function startScene(name){
  state.scene=name;W.scene=SCENES[name];rnd=mulberry(SEEDS[name]);
  W.R0=W.baseR0*(FZ||W.scene.zoom||1);W.cell=W.R0*4;
  W.snakes=[];W.food=[];W.items=[];W.fx=[];W.corpses=[];W.parts=[];W.orphans=[];W.bubbles=[];W.vortices=[];W.meteors=[];W.zones=[];
  W.leader=null;W.sd={};W.sceneT=0;W.night=0;W.nightTarget=0;
  W.scene.setup();syncButtons();updateCaption();
}
function resize(){dpr=window.devicePixelRatio||1;W.w=innerWidth;W.h=innerHeight;cv.width=Math.round(W.w*dpr);cv.height=Math.round(W.h*dpr);
  W.baseR0=clamp(Math.min(W.w,W.h)*0.0108,6,13);W.R0=W.baseR0;W.cell=W.R0*4;}
function updateCaption(){
  const sc=W.scene,cap=$('cap'),st=$('stats');cap.classList.toggle('hide',!state.labels);st.classList.toggle('hide',!state.labels);
  if(state.labels){let html=`<h2>${sc.title}</h2>`;
    if(sc.steps){const k=sc.step();html+='<ol>'+sc.steps.map((x,i)=>`<li class="${i===k?'on':''}">${x}</li>`).join('')+'</ol>';}
    else html+=`<p>${sc.text}</p>`;
    if(sc.cost)html+=`<div class="cost">${sc.cost}</div>`;
    if(state.calm)html+=`<div class="cost">Calm (reduced motion): shader time is frozen; no wriggle, shiver, spin, streaks or bubble pops. Discrete effects play 40% shorter.</div>`;
    cap.innerHTML=html;
    const e=estimate();st.innerHTML=`Vertices / frame (est.) <b>${k1(e.v)}</b> &nbsp;of which new ideas <b>${e.extra}</b>`;}
  const now=new Date();$('clock').textContent=now.toTimeString().slice(0,5);
  $('date').textContent=now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
}
function syncButtons(){
  for(const b of document.querySelectorAll('#scene button'))b.setAttribute('aria-pressed',b.dataset.v===state.scene);
  for(const b of document.querySelectorAll('#palette button'))b.setAttribute('aria-pressed',b.dataset.v===state.palette);
  $('clockBtn').setAttribute('aria-pressed',state.clock);$('calmBtn').setAttribute('aria-pressed',state.calm);
  $('labelsBtn').setAttribute('aria-pressed',state.labels);$('pauseBtn').setAttribute('aria-pressed',state.paused);
  $('clockWrap').style.display=state.clock?'block':'none';
  const fs=Math.max(48,Math.min(W.w,W.h)*0.115);$('clock').style.fontSize=fs+'px';$('date').style.fontSize=Math.max(16,Math.min(W.w,W.h)*0.025)+'px';
}
(function initUI(){
  const pal=$('palette');for(const k in PALETTES){const b=document.createElement('button');b.className='pal';b.dataset.v=k;b.title=PAL_NAMES[k];b.setAttribute('aria-label',PAL_NAMES[k]);
    b.innerHTML='<span>'+PALETTES[k].map(c=>`<i style="background:${c}"></i>`).join('')+'</span>';pal.appendChild(b);}
  $('scene').onclick=e=>{const v=e.target.closest('button')?.dataset.v;if(v)startScene(v);};
  pal.onclick=e=>{const v=e.target.closest('button')?.dataset.v;if(v){setPalette(v);syncButtons();}};
  $('bg').onchange=e=>{state.bg=e.target.value;};
  $('clockBtn').onclick=()=>{state.clock=!state.clock;syncButtons();};
  $('calmBtn').onclick=()=>{state.calm=!state.calm;syncButtons();updateCaption();};
  $('labelsBtn').onclick=()=>{state.labels=!state.labels;syncButtons();updateCaption();};
  $('pauseBtn').onclick=()=>{state.paused=!state.paused;syncButtons();};
  const order=['faces','race','venom','frost','prism','flip','whirl','events','chaos'];
  addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;const k=e.key.toLowerCase();
    if(k===' '){state.paused=!state.paused;e.preventDefault();}
    else if(k==='c')state.clock=!state.clock;else if(k==='n')state.labels=!state.labels;else if(k==='m')state.calm=!state.calm;
    else if(k.length===1&&k>='1'&&k<='9')startScene(order[+k-1]);syncButtons();updateCaption();});
  addEventListener('resize',()=>{resize();startScene(state.scene);});
  addEventListener('hashchange',()=>location.reload());
  // URL hash deep-links a state, e.g. #scene=venom&palette=ember&clock=1&calm=1&t=4
  const q=new URLSearchParams(location.hash.slice(1));
  if(q.get('bg'))state.bg=q.get('bg');$('bg').value=state.bg;
  if(q.get('clock'))state.clock=q.get('clock')==='1';if(q.get('notes'))state.labels=q.get('notes')==='1';if(q.get('calm'))state.calm=q.get('calm')==='1';
  setPalette(q.get('palette')||'ocean');
  (function boot(){ // a pane can report a zero-size viewport for its first frames
    if(innerWidth<200||innerHeight<200){requestAnimationFrame(boot);return;}
    resize();startScene(q.get('scene')||'faces');
    if(q.get('t')){const T=+q.get('t');for(let i=0;i<T*60;i++){update(1/60);if(!state.calm)W.vt+=1/60;}}
    updateCaption();requestAnimationFrame(frame);})();
})();
</script>
</body>
