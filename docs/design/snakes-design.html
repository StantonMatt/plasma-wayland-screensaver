<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snakes Redesign Prototype</title>
<style>
:root{
  --bar:rgba(12,15,24,.86);--line:rgba(255,255,255,.10);--text:#dde3f0;--dim:#8a93a8;
  --on:#f4f6fb;--onbg:rgba(255,255,255,.15);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--text);font:13px/1.35 "Noto Sans",system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#bar{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;
  padding:6px 10px;background:var(--bar);border:1px solid var(--line);border-radius:10px;z-index:5;white-space:nowrap;
  flex-wrap:wrap;justify-content:center;row-gap:6px;max-width:calc(100vw - 32px);
  backdrop-filter:blur(8px)}
.g{display:flex;align-items:center;gap:7px}
.lbl{color:var(--dim);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.seg{display:flex;background:rgba(255,255,255,.05);border-radius:7px;padding:2px;gap:1px}
button{appearance:none;border:0;background:transparent;color:var(--text);font:inherit;padding:4px 9px;border-radius:5px;cursor:pointer}
button:hover{background:rgba(255,255,255,.07)}
button[aria-pressed=true]{background:var(--onbg);color:var(--on)}
.pal{padding:5px 6px}
.pal span{display:flex;gap:1px}.pal i{width:4px;height:12px;border-radius:1px;display:block}
select{background:rgba(255,255,255,.06);color:var(--text);border:0;border-radius:6px;padding:4px 6px;font:inherit}
select option{background:#14171f}
#palname{min-width:52px;color:var(--on)}
#cap{position:fixed;left:16px;bottom:14px;max-width:440px;z-index:4;pointer-events:none;
  background:rgba(8,10,18,.62);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
#cap h2{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--on)}
#cap ol{margin:0;padding-left:18px;color:var(--dim)} #cap li.on{color:var(--on)}
#cap p{margin:0;color:var(--dim)}
#stats{position:fixed;right:16px;bottom:14px;z-index:4;pointer-events:none;font-variant-numeric:tabular-nums;
  background:rgba(8,10,18,.62);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--dim);font-size:12px}
#stats b{color:var(--on);font-weight:600}
#clockWrap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;text-align:center;display:none}
#scrim{position:absolute;left:50%;top:50%;width:200%;height:320%;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(0,0,0,.52),rgba(0,0,0,.30) 55%,rgba(0,0,0,0));z-index:-1}
#clock{color:#f6f8ff;font-weight:300;letter-spacing:2px;text-shadow:0 1px 1px rgba(0,0,0,.25)}
#date{color:#c7d0e8;margin-top:10px}
.hide{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <div class="g"><span class="lbl">Look</span>
    <div class="seg" id="look"><button data-v="current">Current</button><button data-v="new">New</button></div></div>
  <div class="g"><span class="lbl">Scene</span>
    <div class="seg" id="scene">
      <button data-v="eco">Ecosystem</button><button data-v="hunt">Hunt</button><button data-v="encircle">Encircle</button>
      <button data-v="power">Power-ups</button><button data-v="anatomy">Anatomy</button></div></div>
  <div class="g"><span class="lbl">Palette</span><div class="seg" id="palette"></div><span id="palname"></span></div>
  <div class="g"><select id="bg" aria-label="Background">
      <option value="black">Pure black</option><option value="midnight">Midnight</option>
      <option value="ocean">Deep ocean</option><option value="plum">Dark plum</option></select></div>
  <div class="seg">
    <button id="clockBtn">Clock</button><button id="labelsBtn">Notes</button><button id="pauseBtn">Pause</button></div>
</div>
<div id="clockWrap"><div id="scrim"></div><div id="clock"></div><div id="date"></div></div>
<div id="cap"></div>
<div id="stats"></div>
<script>
'use strict';
// ---------------------------------------------------------------- utilities
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const norm=a=>{a=(a+PI)%TAU;if(a<0)a+=TAU;return a-PI;};
function mulberry(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mulberry(7);
const hash=(a)=>{const x=Math.sin(a*127.1)*43758.5453;return x-Math.floor(x);};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const rgba=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a<0?0:a>1?1:a})`;
const lum=c=>(0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255;
const WHITE=[255,255,255],BLACK=[0,0,0],ICE=[200,238,255];
const easeOut=p=>1-(1-p)*(1-p)*(1-p);

const PALETTES={
  ocean:['#d9fbff','#3dd6e8','#3a86ff','#7358d6','#2aa889','#9bf6ff'],
  spectrum:['#ff477e','#ffbe0b','#42e2b8','#3a86ff','#b967ff','#fb5607'],
  ember:['#fff1a8','#ffc857','#ff7b42','#ef3e36','#9c1c28','#ffd6a5'],
  forest:['#d8f3dc','#95d5b2','#52b788','#2d6a4f','#b7e4c7','#74c69d'],
  mono:['#ffffff','#d9e1e8','#aeb8c2','#7f8b96','#edf2f4','#bac4ce'],
  pastel:['#ffc8dd','#bde0fe','#caffbf','#ffd6a5','#e7c6ff','#a2d2ff']};
const PAL_NAMES={ocean:'Ocean',spectrum:'Spectrum',ember:'Ember',forest:'Forest',mono:'Mono',pastel:'Pastel'};
const BGS={black:['#000000','#000000'],midnight:['#071329','#13091e'],ocean:['#02111d','#062f3c'],plum:['#18091d','#310d2c']};
const ACCENT_BASE={surge:'#ffe14d',magnet:'#ff5fd2',phase:'#a98bff',venom:'#9dff3a',frost:'#bdf3ff'};
const KIND_NAME={surge:'Surge',magnet:'Magnet',phase:'Phase',venom:'Venom',frost:'Frost'};
const KIND_TEXT={surge:'free boosts, +25% speed · 6 s',magnet:'pulls food from 3× range · 10 s',
  phase:'passes through bodies · 4 s',venom:'bites off a rival\'s back half · 8 s',frost:'nova slows nearby rivals · 2.5 s'};

const state={look:'new',scene:'eco',palette:'ocean',bg:'black',clock:false,labels:true,paused:false};
let PAL=[],ACC={},CREST=[255,216,74],TONGUE=[255,92,122],EYE=[255,196,84],EYE_HUNT=[255,150,50];
const glowCache=new Map();
function setPalette(name){
  state.palette=name;
  PAL=PALETTES[name].map(hex);
  for(const k in ACCENT_BASE){let c=hex(ACCENT_BASE[k]);
    if(name==='mono'){const l=lum(c)*255;c=mix(c,[l,l,l],0.88);} else if(name==='pastel') c=mix(c,WHITE,0.3);
    ACC[k]=c;}
  CREST=(name==='ember'||name==='mono')?[255,250,236]:[255,214,72];
  TONGUE=name==='mono'?[214,220,228]:[255,92,122];
  EYE=name==='mono'?[232,236,244]:[255,196,84];
  EYE_HUNT=name==='mono'?[255,255,255]:name==='ember'?[255,240,170]:[255,150,50];
  glowCache.clear();
}
// palette entries that are too dark for a black background get their mid-tone lifted
const lifted=c=>{const l=lum(c);return l<0.3?mix(c,WHITE,(0.3-l)*1.1):c;};

function glowSprite(c){
  const k=(c[0]|0)+','+(c[1]|0)+','+(c[2]|0);let g=glowCache.get(k);if(g)return g;
  g=document.createElement('canvas');g.width=g.height=64;const x=g.getContext('2d');
  const gr=x.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,rgba(c,1));gr.addColorStop(0.22,rgba(c,.6));gr.addColorStop(0.55,rgba(c,.16));gr.addColorStop(1,rgba(c,0));
  x.fillStyle=gr;x.fillRect(0,0,64,64);glowCache.set(k,g);return g;
}
function glow(ctx,x,y,R,c,a){if(a<=0.004||R<=0)return;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(glowSprite(c),x-R,y-R,R*2,R*2);ctx.globalAlpha=1;}

// ---------------------------------------------------------------- world
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let dpr=1;
const W={w:0,h:0,R0:8,t:0,sceneT:0,snakes:[],food:[],items:[],fx:[],corpses:[],parts:[],leader:null,
  grid:new Map(),cell:32,foodTarget:0,itemTimer:0,sd:{},scene:null};
const rect=(x0,y0,x1,y1)=>({x0,y0,x1,y1});
const arena=()=>rect(0,0,W.w,W.h);

// body half-width profile along the length (u = 0 head .. 1 tail); collisions use the same curve
function taper(u){
  if(u<0.07)return 0.84+u*16/7;            // neck narrower than the head
  if(u>0.6){const k=(u-0.6)/0.4;return 1-0.78*Math.pow(k,1.6);}
  return 1;
}
let SID=0;
class Snake{
  constructor(o){
    Object.assign(this,{id:SID++,ci:0,len:20,angle:0,brain:null,immune:false,tier:null,leaderForce:false,
      birthLen:14,bounds:null,noWalls:false,speedMul:1,maxLen:420},o);
    this.alive=true;this.desired=this.angle;this.trail=[];this.ts=0;this.pts=[];
    this.boost={state:0,t:0,el:0,shed:0,cost:2};this.bvis=0;this.boostWaveT=0;
    this.effect=null;this.frozen=0;this.killGlow=0;this.waves=[];this.contrail=[];
    this.flags={hunting:false,trapped:false};this.growth=0;this.trapT=0;
    this.blink=0;this.blinkAt=W.t+1+rnd()*6;this.tongue=0;this.tongueAt=W.t+0.5+rnd()*4;
    this.leaderPulseAt=W.t+1;this.respawn=0;this.blockedFrac=0;
    if(o.path)this.layPath(o.path);else this.layStraight(o.x,o.y,this.angle);
  }
  get r(){return W.R0*(this.rMul||1)*(1+Math.min(0.25,Math.max(0,this.len-this.birthLen)*0.0025));}
  get sp(){return this.r*1.18;}
  layStraight(x,y,a){const step=this.sp*0.5,K=Math.ceil((this.len+6)*this.sp/step),pts=[];
    for(let k=K;k>=0;k--)pts.push({x:x-Math.cos(a)*k*step,y:y-Math.sin(a)*k*step});this.layPath(pts);}
  layPath(pts){this.trail=[];this.ts=0;let d=0;
    for(let i=0;i<pts.length;i++){if(i)d+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);this.trail.push({x:pts[i].x,y:pts[i].y,d});}
    const h=pts[pts.length-1];this.hx=h.x;this.hy=h.y;this.place();}
  place(){
    const tr=this.trail,n=this.len,sp=this.sp,pts=this.pts;pts.length=0;
    let ci=tr.length-1;const nw=tr[ci];pts.push({x:nw.x,y:nw.y});
    for(let j=1;j<n;j++){const target=nw.d-sp*j;
      while(ci>this.ts&&tr[ci].d>target)ci--;
      const a=tr[ci],b=tr[Math.min(ci+1,tr.length-1)];const t=clamp((target-a.d)/Math.max(1e-4,b.d-a.d),0,1);
      pts.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});}
    while(this.ts<tr.length-2&&tr[this.ts+1].d<nw.d-sp*(n+3))this.ts++;
    if(this.ts>600){tr.splice(0,this.ts);this.ts=0;}
  }
  speed(){let v=W.R0*11*this.speedMul/(1+Math.max(0,this.len-24)*0.004);
    if(this.boost.state===1)v*=1.6;if(this.effect&&this.effect.kind==='surge')v*=1.25;if(this.frozen>0)v*=0.5;return v;}
  turnRate(){return Math.min(3.4,this.speed()/(3.15*this.r))*(this.frozen>0?0.6:1)+0.6;}
  tryBoost(){
    const b=this.boost;if(b.state!==0||this.frozen>0)return false;
    const free=this.effect&&this.effect.kind==='surge';
    if(!free&&this.len<12)return false;
    b.state=1;b.t=0.8;b.el=0;b.shed=0;b.cost=free?0:2+Math.floor(this.len/100);
    const h=this.pts[0];W.fx.push({type:'ring',x:h.x,y:h.y,r0:this.r,r1:this.r*3.2,t:0,dur:0.28,c:mix(colOf(this),WHITE,.5),lw:1.5});
    return true;
  }
  shed(){const t=this.pts[this.pts.length-1];
    addFood({x:t.x,y:t.y,kind:'pellet',ci:this.ci,value:0.5,life:8,vx:(rnd()-.5)*30,vy:(rnd()-.5)*30});
    this.len=Math.max(6,this.len-1);}
  eat(v){this.growth+=v;while(this.growth>=1&&this.len<this.maxLen){this.len++;this.growth-=1;}}
  step(dt){
    const ctl=this.brain?this.brain(this,dt):{angle:this.angle};
    if(ctl.boost)this.tryBoost();
    const b=this.boost;
    if(b.state===1){b.t-=dt;b.el+=dt;
      if(b.shed<b.cost&&b.el>=b.shed*(0.7/Math.max(1,b.cost))){this.shed();b.shed++;}
      this.boostWaveT-=dt;if(this.boostWaveT<=0){this.boostWaveT=0.11;this.waves.push({pos:0,spd:2.4,c:mix(colOf(this),WHITE,.55),str:0.55,w:3});}
      if(b.t<=0){b.state=2;b.t=(this.effect&&this.effect.kind==='surge')?0.6:1.2;}}
    else if(b.state===2){b.t-=dt;if(b.t<=0)b.state=0;}
    this.bvis+=((b.state===1?1:0)-this.bvis)*Math.min(1,dt*(b.state===1?9:2.6));
    this.desired=ctl.angle;
    const diff=norm(ctl.angle-this.angle),tr=this.turnRate()*dt;
    this.angle=norm(this.angle+clamp(diff,-tr,tr));
    const v=this.speed();
    this.hx+=Math.cos(this.angle)*v*dt;this.hy+=Math.sin(this.angle)*v*dt;
    if(!this.noWalls){const m=this.r*1.2,bd=this.bounds||arena();
      this.hx=clamp(this.hx,bd.x0+m,bd.x1-m);this.hy=clamp(this.hy,bd.y0+m,bd.y1-m);}
    const last=this.trail[this.trail.length-1];const dd=Math.hypot(this.hx-last.x,this.hy-last.y);
    if(dd>0.01)this.trail.push({x:this.hx,y:this.hy,d:last.d+dd});
    this.place();
    if(this.effect){this.effect.t-=dt;if(this.effect.t<=0){const h=this.pts[0];
      W.fx.push({type:'ring',x:h.x,y:h.y,r0:this.r*2,r1:this.r*0.5,t:0,dur:0.35,c:ACC[this.effect.kind],lw:1});this.effect=null;}}
    if(this.frozen>0)this.frozen-=dt;
    this.killGlow=Math.max(0,this.killGlow-dt*0.9);
    if(W.t>this.blinkAt){this.blink=0.15;this.blinkAt=W.t+4+rnd()*7;}this.blink=Math.max(0,this.blink-dt);
    if(W.t>this.tongueAt){this.tongue=0.34;this.tongueAt=W.t+(this.flags.hunting?1.4:3)+rnd()*5;}this.tongue=Math.max(0,this.tongue-dt);
    if((this===W.leader||this.leaderForce)&&W.t>this.leaderPulseAt){this.waves.push({pos:0,spd:0.75,c:CREST,str:0.5,w:7});this.leaderPulseAt=W.t+4;}
    for(const w of this.waves)w.pos+=w.spd*dt;this.waves=this.waves.filter(w=>w.pos<1.15);
    const tail=this.pts[this.pts.length-1];
    for(const c of this.contrail)c.age+=dt;this.contrail=this.contrail.filter(c=>c.age<0.5);
    if(this.bvis>0.08)this.contrail.push({x:tail.x,y:tail.y,age:0});
    if(this.effect&&this.effect.kind==='venom'&&rnd()<dt*7){const i=Math.floor(rnd()*Math.min(8,this.len));const p=this.pts[i];
      W.parts.push({x:p.x,y:p.y,vx:(rnd()-.5)*8,vy:(rnd()-.5)*8,t:0,dur:0.9,c:ACC.venom,size:this.r*0.22});}
    if(this.frozen>0&&rnd()<dt*10){const i=Math.floor(rnd()*this.len);const p=this.pts[i];
      W.parts.push({x:p.x+(rnd()-.5)*this.r,y:p.y+(rnd()-.5)*this.r,vx:0,vy:0,t:0,dur:0.6,c:WHITE,size:this.r*0.5,kind:'star'});}
    this.trapT=this.flags.trapped?Math.min(1,this.trapT+dt*3):Math.max(0,this.trapT-dt*2);
  }
}
const colOf=s=>PAL[s.ci%PAL.length];
const phased=s=>s.effect&&s.effect.kind==='phase';
function tierOf(s){if(s.tier)return s.tier;const n=s.len;return n<24?'hatch':n<100?'adult':n<250?'elder':'titan';}

function wanderPath(x,y,a,L,b){
  const pts=[{x,y}],step=4;let ang=a,turn=0;
  for(let d=0;d<L;d+=step){turn=clamp(turn+(rnd()-.5)*0.12,-0.08,0.08);
    const m=60,cx=(b.x0+b.x1)/2,cy=(b.y0+b.y1)/2;
    if(x<b.x0+m||x>b.x1-m||y<b.y0+m||y>b.y1-m){const want=Math.atan2(cy-y,cx-x);ang+=clamp(norm(want-ang),-0.12,0.12);}
    ang+=turn;x+=Math.cos(ang)*step;y+=Math.sin(ang)*step;pts.push({x,y});}
  return{pts,angle:ang};
}
function circlePath(C,R,len,sp,gap,dir=1){
  const L=(len+8)*sp,pts=[];const ang=L/R;
  for(let a=ang;a>=0;a-=2/R){const rr=R+gap*a/TAU;const th=-dir*a;pts.push({x:C.x+Math.cos(th)*rr,y:C.y+Math.sin(th)*rr});}
  return pts;
}

// food & items
function addFood(o){
  const f=Object.assign({x:0,y:0,vx:0,vy:0,kind:'spark',ci:0,value:0.6,life:40,phase:rnd()*TAU,owner:null,att:0,tx:0,ty:0,rot:rnd()*TAU},o);
  f.maxLife=f.life;
  const R0=W.R0;
  f.size=f.kind==='pellet'?R0*0.2:f.kind==='shard'?R0*0.34:f.kind==='prism'?R0*0.62:R0*(0.23+Math.min(1.4,f.value)*0.13);
  W.food.push(f);return f;
}
function addAmbient(b){b=b||rect(30,70,W.w-30,W.h-30);
  return addFood({x:b.x0+rnd()*(b.x1-b.x0),y:b.y0+rnd()*(b.y1-b.y0),value:0.48+rnd()*0.3,ci:Math.floor(rnd()*6),life:34+rnd()*12});}
const ITEM_W={magnet:30,surge:25,venom:20,phase:15,frost:10};
function randomKind(){let s=0;for(const k in ITEM_W)s+=ITEM_W[k];let r=rnd()*s;for(const k in ITEM_W){r-=ITEM_W[k];if(r<=0)return k;}return 'magnet';}
let IID=0;
function spawnItem(kind,x,y,extra){const it=Object.assign({id:IID++,kind,x,y,age:0,life:25},extra||{});W.items.push(it);
  W.fx.push({type:'ring',x,y,r0:W.R0*7,r1:W.R0*2.2,t:0,dur:0.5,c:ACC[kind],lw:1.2});return it;}
function openSpot(b,tries=14){let best=null,bs=-1;
  for(let k=0;k<tries;k++){const x=b.x0+rnd()*(b.x1-b.x0),y=b.y0+rnd()*(b.y1-b.y0);let m=1e9;
    for(const s of W.snakes){if(!s.alive)continue;for(let i=0;i<s.pts.length;i+=3){const p=s.pts[i];m=Math.min(m,Math.hypot(p.x-x,p.y-y));}}
    if(m>bs){bs=m;best={x,y};}}return best;}

// grid
function buildGrid(){W.grid.clear();const C=W.cell;
  for(const s of W.snakes){if(!s.alive)continue;const p=s.pts;
    for(let i=0;i<p.length;i++){const k=(Math.floor(p[i].x/C)+2000)+(Math.floor(p[i].y/C)+2000)*8192;let a=W.grid.get(k);if(!a){a=[];W.grid.set(k,a);}a.push(s,i);}}}
function forNear(x,y,rad,fn){const C=W.cell;const x0=Math.floor((x-rad)/C),x1=Math.floor((x+rad)/C),y0=Math.floor((y-rad)/C),y1=Math.floor((y+rad)/C);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=W.grid.get((cx+2000)+(cy+2000)*8192);if(!a)continue;for(let j=0;j<a.length;j+=2)fn(a[j],a[j+1]);}}

// ---------------------------------------------------------------- brains
const OFFS=[-1.3,-0.9,-0.55,-0.25,0,0.25,0.55,0.9,1.3];
const PROBES=[[2.2,1.5],[4.5,1],[8,0.5]];
function clearance(s,x,y,ignore){
  const b=s.bounds||arena();let m=s.noWalls?1e9:Math.min(x-b.x0,b.x1-x,y-b.y0,b.y1-y);
  if(!ignore)forNear(x,y,s.r*5,(o,i)=>{if(o===s||!o.alive||phased(o)||phased(s))return;const q=o.pts[i];if(!q)return;const d=Math.hypot(q.x-x,q.y-y)-o.r;if(d<m)m=d;});
  return m;
}
function avoidSteer(s,want,ignore){
  const h=s.pts[0];let best=want,bs=-1e9,blocked=0;const cands=OFFS.map(o=>s.angle+o);cands.push(want);
  for(const a of cands){let pen=0;const ca=Math.cos(a),sa=Math.sin(a);
    for(const [d,wt] of PROBES){const c=clearance(s,h.x+ca*d*s.r,h.y+sa*d*s.r,ignore)-s.r;if(c<2.5*s.r)pen+=wt*(2.5*s.r-c)/(2.5*s.r);}
    if(pen>1.4)blocked++;const sc=Math.cos(norm(a-want))-pen*(s.len>=90?3:1.8);if(sc>bs){bs=sc;best=a;}}
  s.blockedFrac=blocked/cands.length;return best;
}
const angTo=(h,p)=>Math.atan2(p.y-h.y,p.x-h.x);
function interceptPoint(s,prey,ahead){
  const h=s.pts[0],ph=prey.pts[0],dx=Math.cos(prey.angle),dy=Math.sin(prey.angle);let dist=Math.hypot(ph.x-h.x,ph.y-h.y),P=ph;
  for(let k=0;k<3;k++){const tau=dist/(s.speed()*(s.boost.state===1?1:1.3));const L=prey.speed()*tau+ahead*prey.r;
    P={x:ph.x+dx*L,y:ph.y+dy*L};dist=Math.hypot(P.x-h.x,P.y-h.y);}
  return{P,dist};
}
function ecoBrain(s,dt){
  const h=s.pts[0];s.think=(s.think||0)-dt;
  if(s.prey&&(!s.prey.alive||W.t>s.huntUntil||s.prey.gen!==s.preyGen)){s.prey=null;}
  if(s.think<=0){s.think=0.35+rnd()*0.3;
    if(!s.prey&&s.len>=34&&rnd()<0.18){let best=null,bd=1e9;
      for(const o of W.snakes){if(o===s||!o.alive||o.len>s.len*0.75)continue;const d=Math.hypot(o.pts[0].x-h.x,o.pts[0].y-h.y);if(d<28*s.r&&d<bd){bd=d;best=o;}}
      if(best){s.prey=best;s.preyGen=best.gen;s.huntUntil=W.t+5;}}
    let best=null,bv=0;
    for(const f of W.food){const d=Math.hypot(f.x-h.x,f.y-h.y);if(d>34*s.r)continue;const v=f.value/(d+20);if(v>bv){bv=v;best=f;}}
    for(const it of W.items){const d=Math.hypot(it.x-h.x,it.y-h.y);const v=(it.kind==='frost'?6:8)/(d+20);if(v>bv){bv=v;best=it;}}
    s.goal=best;if(!best){if(!s.wp||rnd()<0.2)s.wp={x:80+rnd()*(W.w-160),y:100+rnd()*(W.h-180)};}
  }
  s.flags.hunting=!!s.prey;
  let want,boost=false;
  if(s.prey){const{P,dist}=interceptPoint(s,s.prey,4);want=angTo(h,P);boost=dist<14*s.r&&Math.abs(norm(want-s.angle))<0.5;}
  else if(s.goal&&(W.food.includes(s.goal)||W.items.includes(s.goal)))want=angTo(h,s.goal);
  else want=angTo(h,s.wp||{x:W.w/2,y:W.h/2});
  const a=avoidSteer(s,want);
  s.flags.trapped=s.blockedFrac>0.75;
  if(s.effect&&s.effect.kind==='surge'&&Math.abs(norm(want-s.angle))<0.4)boost=true;
  return{angle:a,boost};
}

// ---------------------------------------------------------------- collisions & death
function snapshot(pts,r,tap=true){const n=pts.length,G={p:pts.map(p=>({x:p.x,y:p.y})),n,nx:new Float32Array(n),ny:new Float32Array(n),tx:new Float32Array(n),ty:new Float32Array(n),w:new Float32Array(n)};
  fillGeom(G,r,tap,false);return G;}
function fillGeom(G,r,tap,breath){const p=G.p,n=G.n;
  for(let i=0;i<n;i++){const a=p[i>0?i-1:0],b=p[i<n-1?i+1:n-1];let dx=a.x-b.x,dy=a.y-b.y;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
    G.tx[i]=dx;G.ty[i]=dy;G.nx[i]=-dy;G.ny[i]=dx;
    G.w[i]=r*(tap?taper(n>1?i/(n-1):0):1)*(breath?1+0.028*Math.sin(W.t*2.4-i*0.32):1);}}
function burst(pts,s,from,to){
  const len=to-from;const n=clamp(Math.round(len*0.85),6,140);
  for(let j=0;j<n;j++){const pos=from+(n>1?j*(len-1)/(n-1):0);const lo=Math.floor(pos),hi=Math.min(to-1,lo+1),fr=pos-lo;
    const a=pts[lo],b=pts[hi];const ang=rnd()*TAU,force=(22+rnd()*90)*W.R0/9;
    addFood({kind:'shard',ci:s.ci,x:a.x+(b.x-a.x)*fr+(rnd()-.5)*s.r,y:a.y+(b.y-a.y)*fr+(rnd()-.5)*s.r,vx:Math.cos(ang)*force,vy:Math.sin(ang)*force,
      value:Math.max(0.65,len/n)*(0.8+rnd()*0.4),life:18+rnd()*16});}
}
function kill(s,at,killer){
  if(!s.alive||s.immune)return;s.alive=false;s.respawn=W.scene.respawn?2.6+rnd()*2.4:Infinity;
  W.corpses.push({G:snapshot(s.pts,s.r),c:lifted(colOf(s)),t:0,dur:0.55,r:s.r});
  W.fx.push({type:'impact',x:at.x,y:at.y,t:0,dur:0.5,c:colOf(s),r:s.r,seed:rnd()*100});
  burst(s.pts,s,0,s.pts.length);
  if(killer&&killer.alive){killer.killGlow=1;killer.waves.push({pos:0,spd:1.1,c:mix(colOf(killer),WHITE,.7),str:1,w:9});}
  if(W.leader===s)W.leader=null;W.sd.killAt=W.sd.killAt||W.sceneT;
}
function sever(b,i,a,q){
  const cut=b.pts.slice(i);b.len=i;
  W.corpses.push({G:snapshot(cut,b.r),c:lifted(colOf(b)),t:0,dur:0.5,r:b.r});
  W.fx.push({type:'impact',x:q.x,y:q.y,t:0,dur:0.5,c:ACC.venom,r:b.r,seed:rnd()*100});
  burst(cut,b,0,cut.length);a.effect=null;a.killGlow=1;a.waves.push({pos:0,spd:1.2,c:ACC.venom,str:1,w:8});
  W.sd.biteAt=W.sceneT;
}
function collisions(){
  if(W.sceneT<1.2)return;
  for(const a of W.snakes){if(!a.alive)continue;const h=a.pts[0];let hit=null;
    forNear(h.x,h.y,a.r*3,(b,i)=>{if(hit||b===a||!b.alive)return;const q=b.pts[i];if(!q)return;
      const rr=(a.r+b.r*taper(i/Math.max(1,b.len-1)))*0.82;if((q.x-h.x)**2+(q.y-h.y)**2<rr*rr)hit={b,i,q};});
    if(!hit)continue;const{b,i,q}=hit;
    if(phased(a)||phased(b))continue;
    if(a.effect&&a.effect.kind==='venom'&&i>b.len*0.5&&i>3){sever(b,i,a,q);continue;}
    if(!W.scene.lethal)continue;
    if(i<=1){if(a.len>=b.len+4)kill(b,q,a);else if(b.len>=a.len+4)kill(a,q,b);else{kill(a,q,b);kill(b,q,a);}}
    else kill(a,{x:(h.x+q.x)/2,y:(h.y+q.y)/2},b);
  }
}
function respawnSnake(s){
  const p=openSpot(rect(80,100,W.w-80,W.h-80));const len=14+Math.floor(rnd()*10);
  const wp=wanderPath(p.x,p.y,rnd()*TAU,(len+8)*W.R0*1.5,rect(50,80,W.w-50,W.h-50));
  s.len=len;s.alive=true;s.gen=(s.gen||0)+1;s.angle=wp.angle;s.effect=null;s.frozen=0;s.waves=[];s.contrail=[];s.prey=null;s.growth=0;
  s.boost={state:0,t:0,el:0,shed:0,cost:2};s.layPath(wp.pts);s.spawnT=W.t;
}

// ---------------------------------------------------------------- update
function updateFood(dt){
  const damp=Math.pow(0.16,dt),scale=W.R0/10.8;
  for(let i=W.food.length-1;i>=0;i--){const f=W.food[i];
    if(!f.static){f.life-=dt;if(f.life<=0){W.food.splice(i,1);continue;}}
    else if(f.demoExpire){f.life-=dt;if(f.life<=0)f.life=4.5;}
    if(Math.abs(f.vx)+Math.abs(f.vy)>0.1){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=damp;f.vy*=damp;
      if(f.x<3||f.x>W.w-3){f.x=clamp(f.x,3,W.w-3);f.vx*=-0.45;}if(f.y<3||f.y>W.h-3){f.y=clamp(f.y,3,W.h-3);f.vy*=-0.45;}}
    f.att=0;if(W.scene.noEat)continue;
    let eater=null,best=1e18;
    if(f.owner&&f.owner.alive){eater=f.owner;const h=eater.pts[0];best=(f.x-h.x)**2+(f.y-h.y)**2;}
    else{f.owner=null;for(const s of W.snakes){if(!s.alive)continue;const h=s.pts[0];const reach=s.r*((s.effect&&s.effect.kind==='magnet')?9:3)+f.size;
      const dx=f.x-h.x,dy=f.y-h.y;if(Math.abs(dx)>reach||Math.abs(dy)>reach)continue;const d2=dx*dx+dy*dy;if(d2<=reach*reach&&d2<best){best=d2;eater=s;}}}
    if(!eater)continue;
    const h=eater.pts[0],dist=Math.sqrt(best),eatR=eater.r*1.16+f.size;f.owner=eater;f.vx=f.vy=0;
    if(dist<=eatR){eater.eat(f.value);W.food.splice(i,1);continue;}
    const pull=clamp(1-(dist-eatR)/(eater.r*1.84),0.08,1);const sp=Math.max((240+pull*420)*scale,eater.speed()*1.8);const tr=Math.min(dist-eatR,sp*dt);
    if(tr>=dist-eatR-0.01){eater.eat(f.value);W.food.splice(i,1);continue;}
    f.x+=(h.x-f.x)/dist*tr;f.y+=(h.y-f.y)/dist*tr;f.att=pull;f.tx=h.x;f.ty=h.y;
  }
  if(!W.scene.noAmbient)for(let k=0;k<3&&W.food.length<W.foodTarget;k++)addAmbient();
}
function applyPowerup(s,it){
  const c=ACC[it.kind];W.fx.push({type:'ring',x:it.x,y:it.y,r0:W.R0*2,r1:W.R0*9,t:0,dur:0.5,c,lw:2});
  W.fx.push({type:'ring',x:it.x,y:it.y,r0:W.R0*1,r1:W.R0*5,t:-0.08,dur:0.4,c:WHITE,lw:1});
  s.waves.push({pos:0,spd:1.3,c,str:0.95,w:7});
  const dur={surge:6,magnet:10,phase:4,venom:8,frost:0.9}[it.kind];s.effect={kind:it.kind,t:dur,dur};
  if(it.kind==='frost'){const h=s.pts[0],R=W.R0*16;W.fx.push({type:'nova',x:h.x,y:h.y,R,t:0,dur:0.7});
    for(const o of W.snakes){if(o===s||!o.alive)continue;const q=o.pts[0];if(Math.hypot(q.x-h.x,q.y-h.y)<R){o.frozen=2.5;o.boost.state=o.boost.state===1?2:o.boost.state;}}}
  W.sd.pickups=(W.sd.pickups||0)+1;
}
function updateItems(dt){
  for(let i=W.items.length-1;i>=0;i--){const it=W.items[i];it.age+=dt;
    if(it.age>it.life){W.items.splice(i,1);W.fx.push({type:'ring',x:it.x,y:it.y,r0:W.R0*2,r1:W.R0*0.3,t:0,dur:0.4,c:ACC[it.kind],lw:1});continue;}
    if(it.static)continue;
    for(const s of W.snakes){if(!s.alive||s.noItems)continue;const h=s.pts[0];if(Math.hypot(h.x-it.x,h.y-it.y)<s.r*1.3+W.R0*2.1){applyPowerup(s,it);W.items.splice(i,1);break;}}}
}
function updateLeader(){
  let best=null;for(const s of W.snakes)if(s.alive&&(!best||s.len>best.len))best=s;
  if(W.scene.noLeader)return;
  if(!best||best.len<30){W.leader=null;return;}
  if(!W.leader||!W.leader.alive||best.len>=W.leader.len+3){if(W.leader!==best){W.leader=best;const h=best.pts[0];
      W.fx.push({type:'ring',x:h.x,y:h.y,r0:best.r,r1:best.r*5,t:0,dur:0.6,c:CREST,lw:1.5});best.leaderPulseAt=W.t;}}
}
function update(dt){
  W.t+=dt;W.sceneT+=dt;
  buildGrid();
  for(const s of W.snakes){if(s.alive)s.step(dt);else{s.respawn-=dt;if(s.respawn<=0)respawnSnake(s);}}
  buildGrid();collisions();updateFood(dt);updateItems(dt);updateLeader();
  for(const f of W.fx)f.t+=dt;W.fx=W.fx.filter(f=>f.t<f.dur);
  for(const c of W.corpses)c.t+=dt;W.corpses=W.corpses.filter(c=>c.t<c.dur);
  for(const p of W.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}W.parts=W.parts.filter(p=>p.t<p.dur);
  if(W.scene.update)W.scene.update(dt);
  if(W.scene.loop&&W.sceneT>W.scene.loop)startScene(state.scene);
}

const LX=-0.55,LY=-0.83; // light direction (screen space)
function ribbon(c,G,k,shift=0,from=0,to=G.n-1,roundTail=false){
  const{p,nx,ny,tx,ty,w}=G;c.beginPath();
  for(let i=from;i<=to;i++){const o=shift?(nx[i]*LX+ny[i]*LY)*w[i]*shift:0,ww=w[i]*k;c.lineTo(p[i].x+nx[i]*(ww+o),p[i].y+ny[i]*(ww+o));}
  const e=to,oe=shift?(nx[e]*LX+ny[e]*LY)*w[e]*shift:0;
  if(roundTail){const a=Math.atan2(ty[e],tx[e]);c.arc(p[e].x+nx[e]*oe,p[e].y+ny[e]*oe,w[e]*k,a+PI/2,a+PI*1.5,false);}
  else c.lineTo(p[e].x-tx[e]*w[e]*k*1.1+nx[e]*oe,p[e].y-ty[e]*w[e]*k*1.1+ny[e]*oe);
  for(let i=to;i>=from;i--){const o=shift?(nx[i]*LX+ny[i]*LY)*w[i]*shift:0,ww=w[i]*k;c.lineTo(p[i].x-nx[i]*(ww-o),p[i].y-ny[i]*(ww-o));}
  const a0=Math.atan2(ty[from],tx[from]),o0=shift?(nx[from]*LX+ny[from]*LY)*w[from]*shift:0;
  c.arc(p[from].x+nx[from]*o0,p[from].y+ny[from]*o0,w[from]*k,a0-PI/2,a0+PI/2,false);c.closePath();
}

}
function headShape(c){

  c.bezierCurveTo(-0.2,-1.12,0.45,-1.16,0.95,-0.78);c.bezierCurveTo(1.3,-0.5,1.46,-0.2,1.42,0);
  c.bezierCurveTo(1.46,0.2,1.3,0.5,0.95,0.78);c.bezierCurveTo(0.45,1.16,-0.2,1.12,-0.6,0.92);c.closePath();
}
const headR=(s,tier)=>s.r*(tier==='hatch'?1.24:1.14);
function headBand(s,G,tier,kx,ky,ox,oy){
  // builds the head outline for one colour band in world space (caller fills)
  const h=G.p[0],a=s.angle,r=headR(s,tier),ly=-Math.sin(a)*LX+Math.cos(a)*LY;
  ctx.save();ctx.translate(h.x,h.y);ctx.rotate(a);ctx.scale(r,r);ctx.translate(ox,ly*oy);ctx.scale(kx,ky);headShape(ctx);ctx.restore();

function headUnder(s,G,base,tier,A){

      ctx.strokeStyle=rgba(base,0.3*s.bvis);ctx.beginPath();ctx.moveTo(1.4,1.0*sg);ctx.quadraticCurveTo(0.7,2.0*sg,-1.2,2.4*sg);ctx.stroke();}
    ctx.globalCompositeOperation='source-over';}

function headOver(s,G,base,tier,isLeader,A){

  ctx.save();ctx.translate(h.x,h.y);ctx.rotate(a);ctx.scale(r,r);ctx.globalAlpha=A;
  if(s.effect&&s.effect.kind==='venom'){ctx.save();ctx.scale(0.86,0.84);headShape(ctx);ctx.restore();ctx.fillStyle=rgba(ACC.venom,.22);ctx.fill();
    ctx.fillStyle=rgba(mix(ACC.venom,WHITE,.6));for(const sg of[-1,1]){ctx.beginPath();ctx.moveTo(1.05,0.32*sg);ctx.lineTo(1.5,0.4*sg);ctx.lineTo(1.12,0.5*sg);ctx.closePath();ctx.fill();}}
  ctx.fillStyle=rgba(mix(base,WHITE,.65),.55);ctx.beginPath();ctx.ellipse(0.35,ly*0.4,0.62,0.16,0,0,TAU);ctx.fill();
  if(tier!=='hatch'){ctx.fillStyle='rgba(0,0,0,.45)';for(const sg of[-1,1]){ctx.beginPath();ctx.arc(1.18,0.2*sg,0.05,0,TAU);ctx.fill();}}

    ctx.beginPath();ctx.moveTo(0.12,-0.8);ctx.quadraticCurveTo(-0.12,0,0.12,0.8);ctx.lineTo(-0.06,0.8);
    for(const[y,len] of[[0.5,0.42],[0,0.55],[-0.5,0.42]]){const x=-0.06-Math.abs(y)*0.25+0.03;ctx.lineTo(x,y+0.16);ctx.lineTo(x-len,y);ctx.lineTo(x,y-0.16);}
    ctx.lineTo(-0.06,-0.8);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.globalCompositeOperation='lighter';glow(ctx,0.02,0,1.0,CREST,0.45+0.2*Math.sin(t*3));ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=rgba(mix(CREST,WHITE,.7));ctx.beginPath();ctx.arc(0.0,0,0.09,0,TAU);ctx.fill();}

  const look=clamp(norm(s.desired-s.angle),-0.9,0.9);

    if(hunting||s.killGlow>0.05||isLeader){ctx.globalCompositeOperation='lighter';glow(ctx,ex,ey,1.15,isLeader?CREST:EYE_HUNT,(hunting?0.35:0.15)+s.killGlow*0.6);ctx.globalCompositeOperation='source-over';}
    ctx.fillStyle='rgba(4,5,10,.92)';ctx.beginPath();ctx.ellipse(ex,ey,eyeR*1.12,eyeR*1.12*Math.max(0.3,bl),0,0,TAU);ctx.fill();
    const iris=isLeader?mix(CREST,WHITE,.25):panic?[236,240,248]:hunting?EYE_HUNT:mix(EYE,base,.22);
    ctx.fillStyle=rgba(iris);ctx.beginPath();ctx.ellipse(ex,ey,eyeR,eyeR*bl,0,0,TAU);ctx.fill();
    if(bl>0.4){const jx=panic?Math.sin(t*31+sg)*0.05:0,jy=panic?Math.cos(t*27+sg)*0.04:0;const px=ex+Math.cos(look)*0.07+jx,py=ey+Math.sin(look)*0.09+jy;
      ctx.fillStyle='#05060b';ctx.beginPath();
      if(panic)ctx.arc(px,py,0.06,0,TAU);else if(hunting)ctx.ellipse(px,py,0.035,0.24*eyeR/0.3*bl,0,0,TAU);else ctx.ellipse(px,py,0.075,0.2*eyeR/0.3*bl,0,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(ex+LX*0.1,ey+ly*0.1-0.06,0.065,0,TAU);ctx.fill();}}

}
function drawCorpse(c){
  const p=c.t/c.dur,G=c.G,n=G.n,flash=Math.max(0,1-p*7);
  for(let s=0;s<n-1;s+=3){const e=Math.min(n-1,s+3),u=s/n,local=clamp(p*1.5-u*0.5,0,1);if(local>=1)continue;
    const dr=local*c.r*1.6*(hash(s+c.r)>0.5?1:-1);ctx.save();ctx.translate(G.nx[s]*dr,G.ny[s]*dr);
    const col=mix(c.c,WHITE,0.35+flash*0.6);ctx.fillStyle=rgba(col,(1-local)*0.95);ribbon(ctx,G,0.95*(1-local*0.5),0,s,e,true);ctx.fill();ctx.restore();}
}
function drawFx(){
  ctx.globalCompositeOperation='lighter';
  for(const f of W.fx){if(f.t<0)continue;const p=f.t/f.dur;
    if(f.type==='ring'){const r=f.r0+(f.r1-f.r0)*easeOut(p);ctx.strokeStyle=rgba(f.c,(1-p)*0.85);ctx.lineWidth=f.lw*(1-p*0.5);ctx.beginPath();ctx.arc(f.x,f.y,r,0,TAU);ctx.stroke();}
    else if(f.type==='impact'){glow(ctx,f.x,f.y,f.r*7*(1-p*0.4),WHITE,(1-p)*(1-p)*0.9);glow(ctx,f.x,f.y,f.r*5,f.c,(1-p)*0.6);
      ctx.strokeStyle=rgba(mix(f.c,WHITE,.5),(1-p)*0.8);ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1+5*easeOut(p)),0,TAU);ctx.stroke();
      ctx.lineCap='round';for(let k=0;k<9;k++){const a=hash(f.seed+k)*TAU,d1=f.r*(1.2+7*easeOut(p)*(0.6+hash(f.seed+k*3)*0.6)),d2=d1+f.r*2.2*(1-p);
        ctx.strokeStyle=rgba(mix(f.c,WHITE,.6),1-p);ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(f.x+Math.cos(a)*d1,f.y+Math.sin(a)*d1);ctx.lineTo(f.x+Math.cos(a)*d2,f.y+Math.sin(a)*d2);ctx.stroke();}}

      ctx.lineWidth=1;for(let k=0;k<18;k++){const a=k*TAU/18+0.2;ctx.beginPath();ctx.moveTo(f.x+Math.cos(a)*r,f.y+Math.sin(a)*r);ctx.lineTo(f.x+Math.cos(a)*(r+W.R0*1.4*(1-p)),f.y+Math.sin(a)*(r+W.R0*1.4*(1-p)));ctx.stroke();}}}

// ---------------------------------------------------------------- labels & estimates
function drawLabels(){
  if(!state.labels)return;ctx.font='12px "Noto Sans",system-ui,sans-serif';ctx.textBaseline='alphabetic';
  if(state.scene==='power'){ctx.textAlign='center';for(const L of W.sd.lanes){ctx.font='600 13px "Noto Sans",system-ui,sans-serif';ctx.fillStyle=rgba(ACC[L.kind]);ctx.fillText(KIND_NAME[L.kind],L.cx,82);
      ctx.font='12px "Noto Sans",system-ui,sans-serif';ctx.fillStyle='rgba(200,208,225,.75)';ctx.fillText(KIND_TEXT[L.kind],L.cx,99);
      if(L.main.effect&&L.main.effect.dur>1.5){ctx.fillStyle='rgba(200,208,225,.55)';ctx.fillText(`active ${L.main.effect.t.toFixed(1)} s`,L.cx,W.h-24);}}
    ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;ctx.beginPath();for(let i=1;i<5;i++){ctx.moveTo(i*W.w/5,66);ctx.lineTo(i*W.w/5,W.h);}ctx.stroke();}
  if(state.scene==='anatomy'){ctx.textAlign='left';ctx.fillStyle='rgba(200,208,225,.7)';
    for(const r of W.sd.rows)ctx.fillText(r.label,16,W.h*r.y-W.R0*5);
    ctx.textAlign='center';for(const f of W.sd.foodLabels)ctx.fillText(f.l,f.x,f.y+W.R0*4.6);
    for(const it of W.items)ctx.fillText(KIND_NAME[it.kind],it.x,it.y+W.R0*4.6);}
}
function estimate(){
  let cur=0,neu=0,leaderLen=0;for(const s of W.snakes)if(s.alive)leaderLen=Math.max(leaderLen,s.len);
  for(const s of W.snakes){if(!s.alive)continue;const n=s.len;
    cur+=(n-1)*12+Math.max(0,Math.floor((n-6)/6)+1)*18+36*3+2*(24+21)+(n===leaderLen?21+42+18:0);
    neu+=(n-1)*6+6+(s.contrail.length?Math.min(s.contrail.length,15)*6:0)+(s.effect?6:0);}
  for(const f of W.food){cur+=63+(f.att>0?6:0);neu+=6+(f.att>0?6:0);}
  neu+=W.items.length*6+W.fx.length*6+W.parts.length*6;for(const c of W.corpses)neu+=c.G.n*6;
  return{cur,neu};
}
const k1=v=>v>=1000?(v/1000).toFixed(1)+'k':String(v);

// ---------------------------------------------------------------- frame
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);drawBackground();
  if(state.look==='new'){drawFoodNew();drawItemsNew();for(const c of W.corpses)drawCorpse(c);for(const s of W.snakes)if(s.alive)drawSnakeNew(s);drawFx();}
  else{drawFoodCur();let ll=0;for(const s of W.snakes)if(s.alive)ll=Math.max(ll,s.len);
    for(const s of W.snakes)if(s.alive)drawSnakeCur(s,state.scene==='anatomy'?(s.leaderForce?s.len:-1):W.scene.noLeader?-1:ll);}
  drawLabels();
  const L=W.scene.loop;let fade=Math.max(0,1-W.sceneT/0.4);if(L)fade=Math.max(fade,clamp((W.sceneT-(L-0.4))/0.4,0,1));
  if(fade>0){ctx.fillStyle=`rgba(0,0,0,${fade})`;ctx.fillRect(0,0,W.w,W.h);}
}
let lastTs=0,capT=0;
function frame(ts){const dt=Math.min(0.05,(ts-lastTs)/1000||0);lastTs=ts;
  if(!state.paused)update(dt);render();
  capT-=dt;if(capT<=0){capT=0.25;updateCaption();}
  requestAnimationFrame(frame);}

// ---------------------------------------------------------------- UI
const $=id=>document.getElementById(id);
function startScene(name){
  state.scene=name;W.scene=SCENES[name];rnd=mulberry({eco:11,hunt:5,encircle:3,power:9,anatomy:2}[name]);
  W.snakes=[];W.food=[];W.items=[];W.fx=[];W.corpses=[];W.parts=[];W.leader=null;W.sd={};W.sceneT=0;
  W.scene.setup();syncButtons();
}
function resize(){dpr=window.devicePixelRatio||1;W.w=innerWidth;W.h=innerHeight;cv.width=Math.round(W.w*dpr);cv.height=Math.round(W.h*dpr);
  W.R0=clamp(Math.min(W.w,W.h)*0.0108,6,13);W.cell=W.R0*4;}
function updateCaption(){
  const sc=W.scene,cap=$('cap'),st=$('stats');cap.classList.toggle('hide',!state.labels||state.scene==='anatomy'||state.scene==='power');st.classList.toggle('hide',!state.labels);
  if(state.labels){let html=`<h2>${sc.title}</h2>`;
    if(sc.steps){const k=sc.step();html+='<ol>'+sc.steps.map((x,i)=>`<li class="${i===k?'on':''}">${x}</li>`).join('')+'</ol>';}
    else html+=`<p>${sc.text}</p>`;
    if(state.look==='current')html+='<p style="margin-top:6px">Current look: today\'s renderer. Boost, power-up and death effects have no visuals in it.</p>';
    cap.innerHTML=html;
    const e=estimate();st.innerHTML=`Vertices / frame (est.) &nbsp;current <b>${k1(e.cur)}</b> &nbsp;new <b>${k1(e.neu)}</b>`;}
  const now=new Date();$('clock').textContent=now.toTimeString().slice(0,5);
  $('date').textContent=now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
}
function syncButtons(){
  for(const b of document.querySelectorAll('#look button'))b.setAttribute('aria-pressed',b.dataset.v===state.look);
  for(const b of document.querySelectorAll('#scene button'))b.setAttribute('aria-pressed',b.dataset.v===state.scene);
  for(const b of document.querySelectorAll('#palette button'))b.setAttribute('aria-pressed',b.dataset.v===state.palette);
  $('palname').textContent=PAL_NAMES[state.palette];
  $('clockBtn').setAttribute('aria-pressed',state.clock);
  $('labelsBtn').setAttribute('aria-pressed',state.labels);$('pauseBtn').setAttribute('aria-pressed',state.paused);
  $('clockWrap').style.display=state.clock?'block':'none';
  $('scrim').style.display=state.look==='new'?'block':'none';
  const fs=Math.max(48,Math.min(W.w,W.h)*0.115);$('clock').style.fontSize=fs+'px';$('date').style.fontSize=Math.max(16,Math.min(W.w,W.h)*0.025)+'px';
}
(function initUI(){

    else if(k==='c')state.clock=!state.clock;else if(k==='n')state.labels=!state.labels;
    else if(k.length===1&&'12345'.includes(k))startScene(['eco','hunt','encircle','power','anatomy'][+k-1]);syncButtons();updateCaption();});
  addEventListener('resize',()=>{resize();startScene(state.scene);});
  // URL hash deep-links a state, e.g. #scene=hunt&look=current&palette=ember&clock=1
  const q=new URLSearchParams(location.hash.slice(1));
  if(q.get('look'))state.look=q.get('look');if(q.get('bg'))state.bg=q.get('bg');$('bg').value=state.bg;
  if(q.get('clock'))state.clock=q.get('clock')==='1';if(q.get('notes'))state.labels=q.get('notes')==='1';
  setPalette(q.get('palette')||'ocean');resize();startScene(q.get('scene')||'eco');
  if(q.get('t')){const T=+q.get('t');for(let i=0;i<T*60;i++)update(1/60);}
  updateCaption();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
