workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Fork MRs run in the fork, never on the parent project's runners.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.*/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages: [build, presentation, release]

default:
  image: ubuntu:26.04
  tags: [ci-public]
  interruptible: true

variables:
  GIT_DEPTH: "0"
  DEBIAN_FRONTEND: noninteractive
  RELEASE_TAG:
    value: ""
    description: "Existing v* tag to republish from a manual web pipeline; empty runs CI."

.build-dependencies:
  before_script:
    - apt-get update
    - >-
      apt-get install --yes --no-install-recommends
      appstream build-essential cargo rustc cmake debhelper desktop-file-utils
      devscripts dpkg-dev extra-cmake-modules libkf6config-dev libkf6idletime-dev
      liblayershellqtinterface-dev lintian ninja-build qt6-base-dev qt6-base-private-dev
      qt6-declarative-dev qt6-shadertools-dev qt6-tools-dev qml6-module-qtquick
      qml6-module-qtquick-controls qml6-module-qtquick-layouts
      qml6-module-org-kde-kirigami qml6-module-org-kde-kcmutils
      qml6-module-org-kde-kirigamiaddons-delegates qml6-module-qtquick-shapes
      shellcheck python3 git ca-certificates

kubuntu-package:
  extends: .build-dependencies
  stage: build
  timeout: 50m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG'
      when: never
    - when: on_success
  script:
    - ./scripts/build-deb.sh "$CI_PROJECT_DIR/.ci/build" "$CI_PROJECT_DIR/.ci/dist"
    - PPA_BUILD_BINARY=0 PPA_SOURCE_REF=HEAD ./scripts/build-ppa-source.sh "$CI_PROJECT_DIR/.ci/ppa"
    - CARGO_NET_OFFLINE=true dpkg-buildpackage -b -us -uc
    - lintian --display-info --pedantic --fail-on error ../plasma-visual-screensaver_*_amd64.changes
    - |
      for package in .ci/dist/*.deb ../plasma-visual-screensaver_*_amd64.deb; do
        destination=$(mktemp -d)
        dpkg-deb --extract "$package" "$destination"
        python3 scripts/check-egldrain-exports.py "$destination/usr/bin/plasma-visual-screensaver"
        rm -rf "$destination"
      done
  artifacts:
    name: plasma-visual-screensaver-$CI_COMMIT_SHA
    expire_in: 14 days
    paths:
      - .ci/dist/*.deb
      - .ci/dist/*.sha256
      - .ci/ppa/*.dsc
      - .ci/ppa/*.tar.*
      - .ci/ppa/*_source.buildinfo
      - .ci/ppa/*_source.changes
      - .ci/ppa/*.SHA256SUMS

multi-output-presentation:
  stage: presentation
  needs: [kubuntu-package]
  timeout: 12m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG'
      when: never
    - when: on_success
  parallel:
    matrix:
      - GRAPHICS_API: [opengl, vulkan]
  before_script:
    - apt-get update
    - >-
      apt-get install --yes --no-install-recommends
      ./.ci/dist/*.deb kwin-wayland mesa-vulkan-drivers libvulkan1
      libgl1-mesa-dri dbus python3 qt6-wayland ca-certificates libcap2-bin
    # Virtual KWin needs no real-time priority; cap_sys_nice exceeds Docker's bounding set.
    - setcap -r /usr/bin/kwin_wayland
  script:
    - mkdir -p .ci/frame-timing
    - python3 scripts/download-release-baseline.py .ci
    - |
      export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
      VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
      export VK_DRIVER_FILES
      test -n "$VK_DRIVER_FILES"
      BASELINE_BINARY=""
      if test -x .ci/release-prefix/usr/bin/plasma-visual-screensaver; then
        BASELINE_BINARY="$CI_PROJECT_DIR/.ci/release-prefix/usr/bin/plasma-visual-screensaver"
      fi
      ./scripts/ci-frame-cadence.sh /usr/bin/plasma-visual-screensaver \
        "$BASELINE_BINARY" "$GRAPHICS_API" "$CI_PROJECT_DIR/.ci/frame-timing"
  artifacts:
    name: frame-timing-$GRAPHICS_API-$CI_COMMIT_SHA
    when: always
    expire_in: 7 days
    paths: [.ci/frame-timing/]

release:
  extends: .build-dependencies
  stage: release
  timeout: 50m
  interruptible: false
  resource_group: releases
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v.*/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_TAG =~ /^v.*/'
  script:
    - |
      tag=${CI_COMMIT_TAG:-}
      if test "$CI_PIPELINE_SOURCE" = web; then tag=$RELEASE_TAG; fi
      git check-ref-format "refs/tags/$tag"
      git rev-parse --verify "refs/tags/$tag^{commit}"
      mkdir -p .ci/tagged-source
      git archive "refs/tags/$tag" | tar -x -C .ci/tagged-source
      project_version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' .ci/tagged-source/CMakeLists.txt | head -1)
      test "$tag" = "v$project_version"
      .ci/tagged-source/scripts/build-deb.sh "$CI_PROJECT_DIR/.ci/build" "$CI_PROJECT_DIR/.ci/dist"
      (cd .ci/tagged-source && CARGO_NET_OFFLINE=true dpkg-buildpackage -b -us -uc)
      lintian --display-info --pedantic --fail-on error .ci/plasma-visual-screensaver_*_amd64.changes
      python3 scripts/gitlab-release.py "$tag" .ci/dist
  artifacts:
    expire_in: 14 days
    paths: [.ci/dist/*.deb, .ci/dist/*.sha256]
